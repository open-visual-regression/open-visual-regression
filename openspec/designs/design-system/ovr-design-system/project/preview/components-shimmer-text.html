<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>OVR — shimmer · text</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>html,body{height:260px;}</style>
</head>
<body>
<div class="card">

<div class="label">shimmer · text · varied widths · staggered phase</div>
<div style="display:flex; flex-direction:column; gap:14px; max-width:480px;">
  <!-- heading + 3 lines -->
  <div style="display:flex; flex-direction:column; gap:8px;">
    <div class="shimmer" style="height:20px; width:60%;" aria-hidden="true"></div>
    <div class="shimmer" style="height:11px; width:100%; animation-delay:0.05s;" aria-hidden="true"></div>
    <div class="shimmer" style="height:11px; width:94%;  animation-delay:0.10s;" aria-hidden="true"></div>
    <div class="shimmer" style="height:11px; width:72%;  animation-delay:0.15s;" aria-hidden="true"></div>
  </div>

  <!-- caption + value -->
  <div style="display:flex; flex-direction:column; gap:6px;">
    <div class="shimmer" style="height:9px;  width:80px;" aria-hidden="true"></div>
    <div class="shimmer" style="height:14px; width:140px; animation-delay:0.08s;" aria-hidden="true"></div>
  </div>
</div>

</div>
</body>
</html>
