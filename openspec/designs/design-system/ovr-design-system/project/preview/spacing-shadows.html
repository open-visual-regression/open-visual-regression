<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>OVR — elevation</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>html,body{height:180px;}</style>
</head>
<body>
<div class="card">

<div class="label">elevation · borders carry it · shadows reserved for popovers</div>
<div style="display:flex; gap:20px; flex:1; align-items:center; padding:20px 0;">
  <div style="display:flex; flex-direction:column; gap:8px; align-items:center;">
    <div style="width:140px; height:80px; background:var(--bg-elevated); border:1px solid var(--border-default); border-radius:4px;"></div>
    <div style="font-size:10px; color:var(--fg-tertiary);">cards · border only</div>
  </div>
  <div style="display:flex; flex-direction:column; gap:8px; align-items:center;">
    <div style="width:140px; height:80px; background:var(--bg-raised); border-radius:6px; box-shadow:var(--shadow-popover);"></div>
    <div style="font-size:10px; color:var(--fg-tertiary);">popover</div>
  </div>
  <div style="display:flex; flex-direction:column; gap:8px; align-items:center;">
    <div style="width:140px; height:80px; background:var(--bg-raised); border-radius:6px; box-shadow:var(--shadow-modal);"></div>
    <div style="font-size:10px; color:var(--fg-tertiary);">modal</div>
  </div>
  <div style="display:flex; flex-direction:column; gap:8px; align-items:center;">
    <div style="width:140px; height:80px; background:var(--bg-elevated); border:1px solid var(--border-default); border-radius:4px; box-shadow:var(--shadow-focus);"></div>
    <div style="font-size:10px; color:var(--fg-tertiary);">focus ring</div>
  </div>
</div>

</div>
</body>
</html>
