<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>OVR — card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>html,body{height:240px;}</style>
</head>
<body>
<div class="card">

<div class="label">card · 4px radius · border, no shadow</div>
<div style="background:var(--bg-elevated); border:1px solid var(--border-default); border-radius:4px; overflow:hidden;">
  <div style="padding:12px 16px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--border-subtle);">
    <span style="color:var(--status-fail); font-size:14px;">●</span>
    <span style="font-size:13px; font-weight:500;">checkout-flow</span>
    <span style="font-size:11px; color:var(--fg-tertiary); margin-left:4px;">#1284</span>
    <span style="font-size:11px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; padding:2px 6px; background:var(--accent-primary); color:var(--fg-on-accent); border-radius:2px; margin-left:auto;">3 CHANGED</span>
  </div>
  <div style="padding:14px 16px; display:flex; align-items:center; gap:20px; font-size:11px; color:var(--fg-secondary);">
    <div><span style="color:var(--fg-tertiary);">snapshots</span> 12</div>
    <div><span style="color:var(--fg-tertiary);">duration</span> 2.4s</div>
    <div><span style="color:var(--fg-tertiary);">viewport</span> 1280×800</div>
    <div><span style="color:var(--fg-tertiary);">browser</span> chromium-117</div>
    <div style="margin-left:auto; color:var(--fg-tertiary);">2m ago</div>
  </div>
</div>

</div>
</body>
</html>
