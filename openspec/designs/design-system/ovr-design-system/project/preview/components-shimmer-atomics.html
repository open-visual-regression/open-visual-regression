<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>OVR — shimmer · atomics</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>html,body{height:260px;}</style>
</head>
<body>
<div class="card">

<div class="label">shimmer · atomics · match the target component's footprint</div>
<div style="display:flex; flex-direction:column; gap:14px;">

  <!-- buttons -->
  <div style="display:flex; gap:8px; align-items:center;">
    <span style="font-size:10px; color:var(--fg-tertiary); width:80px; letter-spacing:0.08em; text-transform:uppercase;">buttons</span>
    <div class="shimmer" style="height:32px; width:96px;" aria-hidden="true"></div>
    <div class="shimmer" style="height:32px; width:80px; animation-delay:0.05s;" aria-hidden="true"></div>
    <div class="shimmer" style="height:32px; width:32px; animation-delay:0.10s;" aria-hidden="true"></div>
    <div class="shimmer" style="height:28px; width:64px; animation-delay:0.15s;" aria-hidden="true"></div>
    <div class="shimmer" style="height:40px; width:120px; animation-delay:0.20s;" aria-hidden="true"></div>
  </div>

  <!-- badges -->
  <div style="display:flex; gap:8px; align-items:center;">
    <span style="font-size:10px; color:var(--fg-tertiary); width:80px; letter-spacing:0.08em; text-transform:uppercase;">badges</span>
    <div class="shimmer" style="height:18px; width:48px;" aria-hidden="true"></div>
    <div class="shimmer" style="height:18px; width:64px; animation-delay:0.05s;" aria-hidden="true"></div>
    <div class="shimmer" style="height:18px; width:80px; animation-delay:0.10s;" aria-hidden="true"></div>
  </div>

  <!-- avatars + inputs -->
  <div style="display:flex; gap:8px; align-items:center;">
    <span style="font-size:10px; color:var(--fg-tertiary); width:80px; letter-spacing:0.08em; text-transform:uppercase;">avatars</span>
    <div class="shimmer" style="height:24px; width:24px;" aria-hidden="true"></div>
    <div class="shimmer" style="height:24px; width:24px; animation-delay:0.05s;" aria-hidden="true"></div>
    <div class="shimmer" style="height:24px; width:24px; animation-delay:0.10s;" aria-hidden="true"></div>
    <span style="width:24px;"></span>
    <span style="font-size:10px; color:var(--fg-tertiary); letter-spacing:0.08em; text-transform:uppercase;">input</span>
    <div class="shimmer" style="height:32px; width:240px; animation-delay:0.15s;" aria-hidden="true"></div>
  </div>

  <!-- chips / glyphs -->
  <div style="display:flex; gap:8px; align-items:center;">
    <span style="font-size:10px; color:var(--fg-tertiary); width:80px; letter-spacing:0.08em; text-transform:uppercase;">glyph + text</span>
    <div class="shimmer" style="height:12px; width:12px; border-radius:50%;" aria-hidden="true"></div>
    <div class="shimmer" style="height:12px; width:140px; animation-delay:0.05s;" aria-hidden="true"></div>
    <div class="shimmer" style="height:12px; width:60px;  animation-delay:0.10s;" aria-hidden="true"></div>
  </div>
</div>

</div>
</body>
</html>
