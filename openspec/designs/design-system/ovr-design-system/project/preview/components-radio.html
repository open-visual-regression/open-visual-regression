<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>OVR — radio</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>html,body{height:220px;}</style>
</head>
<body>
<div class="card">

<div class="label">radio · 14px · circular · accent dot</div>
<div style="display:flex; flex-direction:column; gap:10px; font-size:12px;">
  <label style="display:inline-flex; align-items:center; gap:8px; cursor:pointer;">
    <span style="width:14px; height:14px; background:var(--bg-elevated); border:1px solid var(--accent-primary); border-radius:50%; display:inline-flex; align-items:center; justify-content:center;">
      <span style="width:6px; height:6px; background:var(--accent-primary); border-radius:50%;"></span>
    </span>
    <span>compare against baseline</span>
  </label>
  <label style="display:inline-flex; align-items:center; gap:8px; cursor:pointer;">
    <span style="width:14px; height:14px; background:var(--bg-elevated); border:1px solid var(--border-default); border-radius:50%;"></span>
    <span>compare against previous run</span>
  </label>
  <label style="display:inline-flex; align-items:center; gap:8px; cursor:pointer;">
    <span style="width:14px; height:14px; background:var(--bg-elevated); border:1px solid var(--border-default); border-radius:50%;"></span>
    <span>compare against specific commit</span>
  </label>
  <label style="display:inline-flex; align-items:center; gap:8px; cursor:pointer; color:var(--fg-muted);">
    <span style="width:14px; height:14px; background:var(--bg-inset); border:1px solid var(--border-subtle); border-radius:50%;"></span>
    <span>compare against tag (disabled)</span>
  </label>
</div>

</div>
</body>
</html>
