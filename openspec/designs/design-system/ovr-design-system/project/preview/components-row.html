<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>OVR — run row (core primitive)</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>html,body{height:260px;}</style>
</head>
<body>
<div class="card">

<div class="label">run row · the central UI primitive · 32px tall</div>
<div style="border:1px solid var(--border-subtle); border-radius:4px; overflow:hidden;">
  <div style="display:flex; align-items:stretch; background:var(--bg-elevated); border-bottom:1px solid var(--border-subtle); height:32px;">
    <div style="width:3px; background:var(--diff-change);"></div>
    <div style="display:flex; align-items:center; padding:0 12px; gap:12px; flex:1; font-size:12px;">
      <span style="color:var(--status-fail);">●</span>
      <span style="color:var(--fg-tertiary); width:48px;">#1284</span>
      <span style="font-weight:500;">checkout-flow</span>
      <span style="font-size:10px; color:var(--fg-tertiary); padding:1px 5px; border:1px solid var(--border-default); border-radius:2px;">pr/482</span>
      <span style="margin-left:auto; color:var(--accent-primary); font-weight:600;">3 changed</span>
      <span style="color:var(--fg-tertiary); width:60px; text-align:right;">2m ago</span>
    </div>
  </div>
  <div style="display:flex; align-items:stretch; background:var(--bg-hover); border-bottom:1px solid var(--border-subtle); height:32px;">
    <div style="width:3px; background:var(--diff-add);"></div>
    <div style="display:flex; align-items:center; padding:0 12px; gap:12px; flex:1; font-size:12px;">
      <span style="color:var(--status-pass);">○</span>
      <span style="color:var(--fg-tertiary); width:48px;">#1283</span>
      <span style="font-weight:500;">checkout-flow</span>
      <span style="font-size:10px; color:var(--fg-tertiary); padding:1px 5px; border:1px solid var(--border-default); border-radius:2px;">main</span>
      <span style="margin-left:auto; color:var(--status-pass);">pass</span>
      <span style="color:var(--fg-tertiary); width:60px; text-align:right;">12m ago</span>
    </div>
  </div>
  <div style="display:flex; align-items:stretch; background:var(--bg-elevated); height:32px;">
    <div style="width:3px; background:var(--status-pending);"></div>
    <div style="display:flex; align-items:center; padding:0 12px; gap:12px; flex:1; font-size:12px;">
      <span style="color:var(--status-pending);">◐</span>
      <span style="color:var(--fg-tertiary); width:48px;">#1282</span>
      <span style="font-weight:500;">marketing</span>
      <span style="font-size:10px; color:var(--fg-tertiary); padding:1px 5px; border:1px solid var(--border-default); border-radius:2px;">pr/481</span>
      <span style="margin-left:auto; color:var(--status-pending);">running…</span>
      <span style="color:var(--fg-tertiary); width:60px; text-align:right;">just now</span>
    </div>
  </div>
</div>
<div style="font-size:10px; color:var(--fg-tertiary);">states · default · hover · pending. left edge color = run status.</div>

</div>
</body>
</html>
