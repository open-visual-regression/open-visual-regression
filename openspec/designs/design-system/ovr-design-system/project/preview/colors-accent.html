<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>OVR — accent (diff magenta)</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>html,body{height:180px;}</style>
</head>
<body>
<div class="card">

<div class="label">accent · the one brand color · used sparingly</div>
<div style="display:flex; gap:8px; flex:1;">
  <div style="flex:1; display:flex; flex-direction:column; gap:6px;">
    <div style="height:72px; background:var(--accent-primary);"></div>
    <div style="font-size:10px; color:var(--fg-tertiary);">--accent-primary</div>
    <div style="font-size:10px; color:var(--fg-muted);">primary CTA, brand mark</div>
  </div>
  <div style="flex:1; display:flex; flex-direction:column; gap:6px;">
    <div style="height:72px; background:var(--accent-primary-hover);"></div>
    <div style="font-size:10px; color:var(--fg-tertiary);">--accent-primary-hover</div>
    <div style="font-size:10px; color:var(--fg-muted);">+6% lightness</div>
  </div>
  <div style="flex:1; display:flex; flex-direction:column; gap:6px;">
    <div style="height:72px; background:var(--accent-primary-press);"></div>
    <div style="font-size:10px; color:var(--fg-tertiary);">--accent-primary-press</div>
    <div style="font-size:10px; color:var(--fg-muted);">-4% lightness</div>
  </div>
  <div style="flex:1; display:flex; flex-direction:column; gap:6px;">
    <div style="height:72px; background:var(--accent-primary-dim); border:1px solid var(--border-subtle);"></div>
    <div style="font-size:10px; color:var(--fg-tertiary);">--accent-primary-dim</div>
    <div style="font-size:10px; color:var(--fg-muted);">15% — diff overlay tint</div>
  </div>
  <div style="flex:1; display:flex; flex-direction:column; gap:6px;">
    <div style="height:72px; background:var(--bg-base); outline:2px solid var(--accent-primary-ring); outline-offset:-3px;"></div>
    <div style="font-size:10px; color:var(--fg-tertiary);">--accent-primary-ring</div>
    <div style="font-size:10px; color:var(--fg-muted);">focus outline</div>
  </div>
</div>

</div>
</body>
</html>
