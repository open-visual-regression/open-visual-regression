<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>OVR — labels + numerals</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>html,body{height:200px;}</style>
</head>
<body>
<div class="card">

<div style="display:flex; flex-direction:column; gap:14px;">
  <div style="display:flex; align-items:baseline; gap:16px;">
    <div style="font-size:11px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--fg-secondary);">snapshots · diffs · baseline</div>
    <div class="label" style="margin-left:auto;">label · 11 / 600 / +0.08em / uppercase</div>
  </div>
  <div style="display:flex; align-items:baseline; gap:16px;">
    <div style="font-size:11px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; padding:2px 6px; border:1px solid var(--accent-primary); color:var(--accent-primary); border-radius:2px;">PASS</div>
    <div style="font-size:11px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; padding:2px 6px; border:1px solid var(--diff-add); color:var(--diff-add); border-radius:2px;">PASS</div>
    <div style="font-size:11px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; padding:2px 6px; border:1px solid var(--diff-remove); color:var(--diff-remove); border-radius:2px;">FAIL</div>
    <div style="font-size:11px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; padding:2px 6px; border:1px solid var(--status-pending); color:var(--status-pending); border-radius:2px;">PENDING</div>
    <div class="label" style="margin-left:auto;">status badges</div>
  </div>
  <div style="display:flex; align-items:baseline; gap:24px; font-variant-numeric:tabular-nums; font-size:13px;">
    <span>1,284</span>
    <span>2.4s</span>
    <span>1280×800</span>
    <span>Δ0.12%</span>
    <span>v1.0.4</span>
    <div class="label" style="margin-left:auto;">tabular numerals — always on</div>
  </div>
</div>

</div>
</body>
</html>
