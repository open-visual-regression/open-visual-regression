<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>OVR — borders</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>html,body{height:170px;}</style>
</head>
<body>
<div class="card">

<div class="label">borders · all 1px hairline</div>
<div style="display:flex; gap:12px; flex:1;">
  <div style="flex:1; background:var(--bg-elevated); border:1px solid var(--border-subtle); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:4px;">
    <span style="font-size:11px;">--border-subtle</span>
    <span style="font-size:10px; color:var(--fg-tertiary);">table rules</span>
  </div>
  <div style="flex:1; background:var(--bg-elevated); border:1px solid var(--border-default); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:4px;">
    <span style="font-size:11px;">--border-default</span>
    <span style="font-size:10px; color:var(--fg-tertiary);">cards, inputs</span>
  </div>
  <div style="flex:1; background:var(--bg-elevated); border:1px solid var(--border-strong); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:4px;">
    <span style="font-size:11px;">--border-strong</span>
    <span style="font-size:10px; color:var(--fg-tertiary);">emphasized</span>
  </div>
  <div style="flex:1; background:var(--bg-elevated); border:1px dashed var(--border-default); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:4px;">
    <span style="font-size:11px;">1px dashed</span>
    <span style="font-size:10px; color:var(--fg-tertiary);">drop / empty</span>
  </div>
</div>

</div>
</body>
</html>
