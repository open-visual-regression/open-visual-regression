<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>OVR — dialog</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>html,body{height:360px;}</style>
</head>
<body>
<div class="card">

<div class="label">dialog · 6px radius · modal shadow · max 480px</div>
<div style="flex:1; position:relative; background:var(--bg-inset); background-image:var(--pixel-grid); background-size:var(--pixel-grid-size); border:1px solid var(--border-subtle); overflow:hidden;">
  <!-- backdrop -->
  <div style="position:absolute; inset:0; background:rgba(0,0,0,0.55);"></div>
  <!-- dialog -->
  <div style="position:absolute; top:24px; left:50%; transform:translateX(-50%); width:480px; background:var(--bg-elevated); border:1px solid var(--border-default); border-radius:6px; box-shadow:var(--shadow-modal); padding:0; overflow:hidden;">
    <div style="padding:18px 20px 12px; display:flex; align-items:flex-start; gap:12px;">
      <span style="color:var(--diff-remove); font-size:18px;">●</span>
      <div style="flex:1;">
        <div style="font-size:14px; font-weight:600; margin-bottom:4px;">delete run #1284?</div>
        <div style="font-size:12px; color:var(--fg-secondary); line-height:1.5;">this removes 12 snapshots and 3 unresolved diffs. baseline is unaffected. this cannot be undone.</div>
      </div>
    </div>
    <div style="padding:12px 20px; background:var(--bg-elevated); border-top:1px solid var(--border-subtle); display:flex; gap:8px; justify-content:flex-end;">
      <button style="height:32px; padding:0 14px; background:transparent; color:var(--fg-secondary); border:none; border-radius:2px; font-family:inherit; font-size:12px; cursor:pointer;">cancel</button>
      <button style="height:32px; padding:0 14px; background:transparent; color:var(--diff-remove); border:1px solid var(--diff-remove); border-radius:2px; font-family:inherit; font-size:12px; font-weight:500; cursor:pointer;">delete run</button>
    </div>
  </div>
</div>

</div>
</body>
</html>
