<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>OVR — shimmer · card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>html,body{height:280px;}</style>
</head>
<body>
<div class="card">

<div class="label">shimmer · card · structure is preserved, content is shimmered</div>
<div style="display:flex; gap:12px;">
  <!-- run card skeleton -->
  <div style="flex:1; background:var(--bg-elevated); border:1px solid var(--border-default); border-radius:4px; overflow:hidden;">
    <div style="padding:12px 16px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--border-subtle);">
      <div class="shimmer" style="width:12px; height:12px; border-radius:50%;" aria-hidden="true"></div>
      <div class="shimmer" style="width:140px; height:13px; animation-delay:0.05s;" aria-hidden="true"></div>
      <div class="shimmer" style="width:48px;  height:11px; margin-left:8px; animation-delay:0.10s;" aria-hidden="true"></div>
      <div class="shimmer" style="width:68px;  height:18px; margin-left:auto; animation-delay:0.15s;" aria-hidden="true"></div>
    </div>
    <div style="padding:14px 16px; display:flex; align-items:center; gap:20px;">
      <div class="shimmer" style="width:60px; height:11px;" aria-hidden="true"></div>
      <div class="shimmer" style="width:48px; height:11px; animation-delay:0.05s;" aria-hidden="true"></div>
      <div class="shimmer" style="width:80px; height:11px; animation-delay:0.10s;" aria-hidden="true"></div>
      <div class="shimmer" style="width:96px; height:11px; animation-delay:0.15s;" aria-hidden="true"></div>
    </div>
  </div>

  <!-- snapshot card skeleton -->
  <div style="width:240px; background:var(--bg-elevated); border:1px solid var(--border-default); border-radius:4px; overflow:hidden;">
    <div class="shimmer" style="height:120px; width:100%; border-radius:0;" aria-hidden="true"></div>
    <div style="padding:10px 12px; display:flex; flex-direction:column; gap:6px;">
      <div style="display:flex; align-items:center; gap:8px;">
        <div class="shimmer" style="width:10px; height:10px; border-radius:50%;" aria-hidden="true"></div>
        <div class="shimmer" style="width:120px; height:11px; animation-delay:0.05s;" aria-hidden="true"></div>
      </div>
      <div class="shimmer" style="width:96px; height:9px; animation-delay:0.10s;" aria-hidden="true"></div>
    </div>
  </div>
</div>

</div>
</body>
</html>
