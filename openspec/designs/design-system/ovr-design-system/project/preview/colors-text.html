<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>OVR — foreground (text)</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>html,body{height:220px;}</style>
</head>
<body>
<div class="card">

<div class="label">foreground · text on bg-base</div>
<div style="display:flex; flex-direction:column; gap:8px;">
  <div style="display:flex; align-items:center; gap:16px;">
    <div style="width:32px; height:32px; background:var(--fg-primary); border:1px solid var(--border-subtle);"></div>
    <span style="color:var(--fg-primary); font-size:14px;">fg-primary — headings, body</span>
    <span class="label" style="margin-left:auto;">--fg-primary</span>
  </div>
  <div style="display:flex; align-items:center; gap:16px;">
    <div style="width:32px; height:32px; background:var(--fg-secondary); border:1px solid var(--border-subtle);"></div>
    <span style="color:var(--fg-secondary); font-size:14px;">fg-secondary — labels, dim body</span>
    <span class="label" style="margin-left:auto;">--fg-secondary</span>
  </div>
  <div style="display:flex; align-items:center; gap:16px;">
    <div style="width:32px; height:32px; background:var(--fg-tertiary); border:1px solid var(--border-subtle);"></div>
    <span style="color:var(--fg-tertiary); font-size:14px;">fg-tertiary — metadata, captions</span>
    <span class="label" style="margin-left:auto;">--fg-tertiary</span>
  </div>
  <div style="display:flex; align-items:center; gap:16px;">
    <div style="width:32px; height:32px; background:var(--fg-muted); border:1px solid var(--border-subtle);"></div>
    <span style="color:var(--fg-muted); font-size:14px;">fg-muted — disabled, placeholder</span>
    <span class="label" style="margin-left:auto;">--fg-muted</span>
  </div>
</div>

</div>
</body>
</html>
