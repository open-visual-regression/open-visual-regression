<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>OVR — tabs</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>html,body{height:220px;}</style>
</head>
<body>
<div class="card">

<div class="label">tabs · underlined · accent indicator</div>
<div style="display:flex; align-items:center; gap:0; border-bottom:1px solid var(--border-default);">
  <button style="padding:8px 12px; background:transparent; border:none; border-bottom:2px solid var(--accent-primary); color:var(--fg-primary); font-family:inherit; font-size:12px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; margin-bottom:-1px;">
    snapshots
    <span style="color:var(--fg-muted); font-size:11px;">12</span>
  </button>
  <button style="padding:8px 12px; background:transparent; border:none; border-bottom:2px solid transparent; color:var(--fg-tertiary); font-family:inherit; font-size:12px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; margin-bottom:-1px;">
    diffs
    <span style="color:var(--accent-primary); font-weight:600; font-size:11px;">3</span>
  </button>
  <button style="padding:8px 12px; background:transparent; border:none; border-bottom:2px solid transparent; color:var(--fg-tertiary); font-family:inherit; font-size:12px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; margin-bottom:-1px;">
    logs
  </button>
  <button style="padding:8px 12px; background:transparent; border:none; border-bottom:2px solid transparent; color:var(--fg-tertiary); font-family:inherit; font-size:12px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; margin-bottom:-1px;">
    config
  </button>
  <div style="margin-left:auto; padding:0 12px; font-size:10px; color:var(--fg-tertiary); letter-spacing:0.08em; text-transform:uppercase;">underlined · primary tabs</div>
</div>

<div class="label" style="margin-top:8px;">segmented · button-style</div>
<div style="display:inline-flex; border:1px solid var(--border-default); border-radius:2px; overflow:hidden; align-self:flex-start;">
  <button style="height:28px; padding:0 12px; background:var(--bg-active); color:var(--fg-primary); border:none; border-right:1px solid var(--border-default); font-family:inherit; font-size:11px; cursor:pointer;">all</button>
  <button style="height:28px; padding:0 12px; background:var(--bg-elevated); color:var(--fg-secondary); border:none; border-right:1px solid var(--border-default); font-family:inherit; font-size:11px; cursor:pointer;">changed</button>
  <button style="height:28px; padding:0 12px; background:var(--bg-elevated); color:var(--fg-secondary); border:none; border-right:1px solid var(--border-default); font-family:inherit; font-size:11px; cursor:pointer;">pass</button>
  <button style="height:28px; padding:0 12px; background:var(--bg-elevated); color:var(--fg-secondary); border:none; font-family:inherit; font-size:11px; cursor:pointer;">fail</button>
</div>

</div>
</body>
</html>
