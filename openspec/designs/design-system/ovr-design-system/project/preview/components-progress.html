<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>OVR — progress</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>html,body{height:460px;}</style>
</head>
<body>
<div class="card">

<div class="label">progress · single · 4px / 8px heights · accent fill</div>
<div style="display:flex; flex-direction:column; gap:12px;">

  <!-- single, with label -->
  <div style="display:flex; flex-direction:column; gap:4px;">
    <div style="display:flex; font-size:11px;">
      <span style="color:var(--fg-secondary);">uploading baseline</span>
      <span style="margin-left:auto; color:var(--fg-tertiary);">7 / 12 · 58%</span>
    </div>
    <div style="height:4px; background:var(--bg-inset); border-radius:2px; overflow:hidden;">
      <div style="height:100%; width:58%; background:var(--accent-primary);"></div>
    </div>
  </div>

  <!-- single, indeterminate -->
  <div style="display:flex; flex-direction:column; gap:4px;">
    <div style="display:flex; font-size:11px;">
      <span style="color:var(--fg-secondary);">connecting to runner</span>
      <span style="margin-left:auto; color:var(--fg-tertiary);">—</span>
    </div>
    <div style="height:4px; background:var(--bg-inset); border-radius:2px; overflow:hidden; position:relative;">
      <div style="position:absolute; top:0; left:0; height:100%; width:30%; background:var(--accent-primary); animation:ovrProgIndeterminate 1.4s ease-in-out infinite;"></div>
    </div>
  </div>

</div>

<div class="label" style="margin-top:6px;">progress · segmented · multiple statuses in one bar</div>
<div style="display:flex; flex-direction:column; gap:8px;">
  <!-- run progress: snapshots in mixed states -->
  <div style="display:flex; flex-direction:column; gap:6px;">
    <div style="display:flex; align-items:baseline; font-size:11px;">
      <span style="font-weight:600;">run #1284</span>
      <span style="color:var(--fg-tertiary); margin-left:8px;">snapshots in flight</span>
      <span style="margin-left:auto; color:var(--fg-tertiary);">9 / 12</span>
    </div>
    
  <div style="display:flex; height:8px; background:var(--bg-inset); border-radius:2px; overflow:hidden;">
    <div style="width:41.67%; background:var(--diff-add); border-right:1px solid var(--bg-base);"></div><div style="width:25.00%; background:var(--accent-primary); border-right:1px solid var(--bg-base);"></div><div style="width:8.33%; background:var(--diff-remove); border-right:1px solid var(--bg-base);"></div><div style="width:16.67%; background:var(--status-pending); border-right:1px solid var(--bg-base);"></div><div style="width:8.33%; background:var(--border-default); "></div>
  </div>
    
  <div style="display:flex; gap:14px; font-size:10px; color:var(--fg-tertiary); flex-wrap:wrap;">
    <div style="display:flex; align-items:center; gap:6px;"><span style="width:8px; height:8px; background:var(--diff-add); flex-shrink:0;"></span><span style="color:var(--fg-secondary);">pass</span> <span>5</span></div><div style="display:flex; align-items:center; gap:6px;"><span style="width:8px; height:8px; background:var(--accent-primary); flex-shrink:0;"></span><span style="color:var(--fg-secondary);">changed</span> <span>3</span></div><div style="display:flex; align-items:center; gap:6px;"><span style="width:8px; height:8px; background:var(--diff-remove); flex-shrink:0;"></span><span style="color:var(--fg-secondary);">failed</span> <span>1</span></div><div style="display:flex; align-items:center; gap:6px;"><span style="width:8px; height:8px; background:var(--status-pending); flex-shrink:0;"></span><span style="color:var(--fg-secondary);">processing</span> <span>2</span></div><div style="display:flex; align-items:center; gap:6px;"><span style="width:8px; height:8px; background:var(--border-default); flex-shrink:0;"></span><span style="color:var(--fg-secondary);">pending</span> <span>1</span></div>
  </div>
  </div>

  <!-- project-level: rolled-up status across all snapshots -->
  <div style="display:flex; flex-direction:column; gap:6px; margin-top:6px;">
    <div style="display:flex; align-items:baseline; font-size:11px;">
      <span style="font-weight:600;">checkout-flow</span>
      <span style="color:var(--fg-tertiary); margin-left:8px;">last 7 days · 47 runs</span>
      <span style="margin-left:auto; color:var(--diff-add); font-variant-numeric:tabular-nums;">89% pass</span>
    </div>
    
  <div style="display:flex; height:6px; background:var(--bg-inset); border-radius:2px; overflow:hidden;">
    <div style="width:89.36%; background:var(--diff-add); border-right:1px solid var(--bg-base);"></div><div style="width:6.38%; background:var(--accent-primary); border-right:1px solid var(--bg-base);"></div><div style="width:4.26%; background:var(--diff-remove); "></div>
  </div>
  </div>
</div>

<style>
  @keyframes ovrProgIndeterminate {
    0%   { left: -30%; }
    100% { left: 100%; }
  }
</style>

</div>
</body>
</html>
