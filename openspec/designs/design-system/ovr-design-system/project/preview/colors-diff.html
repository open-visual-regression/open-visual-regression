<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>OVR — diff semantics</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>html,body{height:160px;}</style>
</head>
<body>
<div class="card">

<div class="label">diff semantics · the comparison vocabulary</div>
<div style="display:flex; gap:10px; flex:1;">
  <div style="flex:1; background:var(--diff-add-dim); border:1px solid var(--diff-add); padding:12px; display:flex; flex-direction:column; justify-content:center; gap:6px;">
    <div style="font-size:13px; color:var(--diff-add); font-weight:600;">+ added pixels</div>
    <div style="font-size:10px; color:var(--fg-tertiary);">--diff-add · oklch(0.78 0.20 145)</div>
  </div>
  <div style="flex:1; background:var(--diff-change-dim); border:1px solid var(--diff-change); padding:12px; display:flex; flex-direction:column; justify-content:center; gap:6px;">
    <div style="font-size:13px; color:var(--diff-change); font-weight:600;">~ changed pixels</div>
    <div style="font-size:10px; color:var(--fg-tertiary);">--diff-change · accent magenta</div>
  </div>
  <div style="flex:1; background:var(--diff-remove-dim); border:1px solid var(--diff-remove); padding:12px; display:flex; flex-direction:column; justify-content:center; gap:6px;">
    <div style="font-size:13px; color:var(--diff-remove); font-weight:600;">− removed pixels</div>
    <div style="font-size:10px; color:var(--fg-tertiary);">--diff-remove · oklch(0.68 0.23 25)</div>
  </div>
</div>

</div>
</body>
</html>
