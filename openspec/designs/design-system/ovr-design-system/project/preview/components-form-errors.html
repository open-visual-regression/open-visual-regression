<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>OVR — form errors</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>html,body{height:320px;}</style>
</head>
<body>
<div class="card">

<div class="label">field error states · inline · destructive border + helper text</div>
<div style="display:flex; flex-direction:column; gap:14px; max-width:520px;">
  <!-- error -->
  <div style="display:flex; flex-direction:column; gap:4px;">
    <label style="font-size:10px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--fg-secondary);">project slug</label>
    <input value="checkout flow" style="height:32px; padding:0 10px; background:var(--bg-elevated); border:1px solid var(--diff-remove); border-radius:2px; color:var(--fg-primary); font-family:inherit; font-size:12px;">
    <div style="display:flex; align-items:center; gap:6px; font-size:11px; color:var(--diff-remove);">
      <span>✗</span>
      <span>slug must be lowercase, kebab-case · no spaces</span>
    </div>
  </div>
  <!-- warning -->
  <div style="display:flex; flex-direction:column; gap:4px;">
    <label style="font-size:10px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--fg-secondary);">baseline branch</label>
    <input value="master" style="height:32px; padding:0 10px; background:var(--bg-elevated); border:1px solid var(--status-pending); border-radius:2px; color:var(--fg-primary); font-family:inherit; font-size:12px;">
    <div style="display:flex; align-items:center; gap:6px; font-size:11px; color:var(--status-pending);">
      <span>△</span>
      <span>branch exists but has no recent commits · using main instead</span>
    </div>
  </div>
  <!-- success -->
  <div style="display:flex; flex-direction:column; gap:4px;">
    <label style="font-size:10px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--fg-secondary);">github token</label>
    <input value="ghp_•••••••••••••••••• kPpd9" style="height:32px; padding:0 10px; background:var(--bg-elevated); border:1px solid var(--diff-add); border-radius:2px; color:var(--fg-primary); font-family:inherit; font-size:12px;">
    <div style="display:flex; align-items:center; gap:6px; font-size:11px; color:var(--diff-add);">
      <span>✓</span>
      <span>verified · scopes: repo, pull_requests</span>
    </div>
  </div>
</div>

</div>
</body>
</html>
