<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>OVR — alert dialog</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>html,body{height:380px;}</style>
</head>
<body>
<div class="card">

<div class="label">alert dialog · destructive confirmation · 2 actions only</div>
<div style="flex:1; position:relative; background:var(--bg-inset); background-image:var(--pixel-grid); background-size:var(--pixel-grid-size); border:1px solid var(--border-subtle); overflow:hidden;">
  <!-- backdrop -->
  <div style="position:absolute; inset:0; background:rgba(0,0,0,0.55);"></div>

  <!-- alert dialog -->
  <div style="position:absolute; top:24px; left:50%; transform:translateX(-50%); width:480px; background:var(--bg-elevated); border:1px solid var(--diff-remove); border-radius:6px; box-shadow:var(--shadow-modal); overflow:hidden;">
    <!-- destructive accent strip across top -->
    <div style="height:3px; background:var(--diff-remove);"></div>

    <div style="padding:20px 20px 14px; display:flex; align-items:flex-start; gap:14px;">
      <div style="width:32px; height:32px; border-radius:2px; background:var(--diff-remove-dim); border:1px solid var(--diff-remove); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <span style="color:var(--diff-remove); font-size:16px; line-height:1;">!</span>
      </div>
      <div style="flex:1;">
        <div style="font-size:14px; font-weight:600; margin-bottom:6px;">discard 3 unresolved diffs?</div>
        <div style="font-size:12px; color:var(--fg-secondary); line-height:1.55;">
          rejecting run <span style="color:var(--fg-primary);">#1284</span> will discard the proposed snapshot updates and keep the existing baseline. this cannot be undone.
        </div>
        <div style="margin-top:12px; padding:8px 10px; background:var(--bg-inset); border-left:2px solid var(--diff-remove); font-size:11px; color:var(--fg-tertiary); font-family:var(--font-mono);">
          <span style="color:var(--diff-remove);">✗</span> cart-empty &nbsp;&nbsp; Δ0.42%<br>
          <span style="color:var(--diff-remove);">✗</span> cart-with-items &nbsp;&nbsp; Δ1.84%<br>
          <span style="color:var(--diff-remove);">✗</span> checkout-step-1-address &nbsp;&nbsp; Δ0.31%
        </div>
      </div>
    </div>

    <div style="padding:12px 20px; background:var(--bg-elevated); border-top:1px solid var(--border-subtle); display:flex; gap:8px; justify-content:flex-end;">
      <button style="height:32px; padding:0 14px; background:transparent; color:var(--fg-secondary); border:none; border-radius:2px; font-family:inherit; font-size:12px; cursor:pointer;">keep reviewing</button>
      <button style="height:32px; padding:0 14px; background:var(--diff-remove); color:#fff; border:none; border-radius:2px; font-family:inherit; font-size:12px; font-weight:600; cursor:pointer;">reject run</button>
    </div>
  </div>
</div>

</div>
</body>
</html>
