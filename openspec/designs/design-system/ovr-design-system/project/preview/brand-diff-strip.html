<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>OVR — diff strip motif</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>html,body{height:170px;}</style>
</head>
<body>
<div class="card">

<div class="label">diff strip — recurring brand motif. left edge of a run row.</div>
<div class="card-grid" style="gap:8px;">
  <div style="display:flex; align-items:stretch; background:var(--bg-elevated); border:1px solid var(--border-subtle); height:32px;">
    <div style="width:3px; background:var(--diff-change);"></div>
    <div style="display:flex; align-items:center; padding:0 12px; font-size:12px; gap:14px;">
      <span style="color:var(--fg-tertiary);">#1284</span>
      <span>checkout-flow</span>
      <span style="color:var(--fg-tertiary); margin-left:auto;">3 changed</span>
    </div>
  </div>
  <div style="display:flex; align-items:stretch; background:var(--bg-elevated); border:1px solid var(--border-subtle); height:32px;">
    <div style="width:3px; background:var(--diff-add);"></div>
    <div style="display:flex; align-items:center; padding:0 12px; font-size:12px; gap:14px;">
      <span style="color:var(--fg-tertiary);">#1283</span>
      <span>checkout-flow</span>
      <span style="color:var(--diff-add); margin-left:auto;">pass</span>
    </div>
  </div>
  <div style="display:flex; align-items:stretch; background:var(--bg-elevated); border:1px solid var(--border-subtle); height:32px;">
    <div style="width:3px; background:var(--diff-remove);"></div>
    <div style="display:flex; align-items:center; padding:0 12px; font-size:12px; gap:14px;">
      <span style="color:var(--fg-tertiary);">#1282</span>
      <span>marketing</span>
      <span style="color:var(--diff-remove); margin-left:auto;">1 removed</span>
    </div>
  </div>
</div>

</div>
</body>
</html>
