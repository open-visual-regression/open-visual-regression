<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>OVR — textarea</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>html,body{height:260px;}</style>
</head>
<body>
<div class="card">

<div class="label">textarea · resizable · monospace</div>
<div style="display:flex; flex-direction:column; gap:4px; max-width:520px;">
  <label style="font-size:10px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--fg-secondary);">approval note</label>
  <textarea rows="4" style="padding:8px 10px; background:var(--bg-elevated); border:1px solid var(--accent-primary); border-radius:2px; color:var(--fg-primary); font-family:inherit; font-size:12px; line-height:1.5; resize:vertical; outline:2px solid var(--accent-primary-ring); outline-offset:0;">redesigned checkout CTA per design spec.
checked across all viewports — looks correct.</textarea>
  <div style="display:flex; font-size:10px; color:var(--fg-tertiary);">
    <span>markdown supported</span>
    <span style="margin-left:auto;">96 / 500</span>
  </div>
</div>

</div>
</body>
</html>
