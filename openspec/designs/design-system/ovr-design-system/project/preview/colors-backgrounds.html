<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>OVR — background elevations</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>html,body{height:170px;}</style>
</head>
<body>
<div class="card">

<div class="label">background elevations · dark theme</div>
<div style="display:flex; gap:8px; flex:1;">
  
<div style="display:flex; flex-direction:column; gap:6px; flex:1;">
  <div style="height:56px; background:var(--bg-inset); border:1px solid var(--border-subtle);"></div>
  <div style="font-size:10px; color:var(--fg-tertiary); letter-spacing:0.04em;">bg-inset</div>
  <div style="font-size:10px; color:var(--fg-muted);">inset / code</div>
</div>
  
<div style="display:flex; flex-direction:column; gap:6px; flex:1;">
  <div style="height:56px; background:var(--bg-base); border:1px solid var(--border-subtle);"></div>
  <div style="font-size:10px; color:var(--fg-tertiary); letter-spacing:0.04em;">bg-base</div>
  <div style="font-size:10px; color:var(--fg-muted);">app base</div>
</div>
  
<div style="display:flex; flex-direction:column; gap:6px; flex:1;">
  <div style="height:56px; background:var(--bg-elevated); border:1px solid var(--border-subtle);"></div>
  <div style="font-size:10px; color:var(--fg-tertiary); letter-spacing:0.04em;">bg-elevated</div>
  <div style="font-size:10px; color:var(--fg-muted);">cards</div>
</div>
  
<div style="display:flex; flex-direction:column; gap:6px; flex:1;">
  <div style="height:56px; background:var(--bg-hover); border:1px solid var(--border-subtle);"></div>
  <div style="font-size:10px; color:var(--fg-tertiary); letter-spacing:0.04em;">bg-hover</div>
  <div style="font-size:10px; color:var(--fg-muted);">row hover</div>
</div>
  
<div style="display:flex; flex-direction:column; gap:6px; flex:1;">
  <div style="height:56px; background:var(--bg-raised); border:1px solid var(--border-subtle);"></div>
  <div style="font-size:10px; color:var(--fg-tertiary); letter-spacing:0.04em;">bg-raised</div>
  <div style="font-size:10px; color:var(--fg-muted);">popovers</div>
</div>
  
<div style="display:flex; flex-direction:column; gap:6px; flex:1;">
  <div style="height:56px; background:var(--bg-active); border:1px solid var(--border-subtle);"></div>
  <div style="font-size:10px; color:var(--fg-tertiary); letter-spacing:0.04em;">bg-active</div>
  <div style="font-size:10px; color:var(--fg-muted);">selected</div>
</div>
</div>

</div>
</body>
</html>
