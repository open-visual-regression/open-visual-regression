<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>OVR — logo</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>html,body{height:150px;}</style>
</head>
<body>
<div class="card">
<div class="card-row" style="gap:48px; flex:1; align-items:center;">

  <!-- Primary lockup: bar + (wordmark · cursor) + tagline.
       Bar extends equally above the top of "ovr" and below the bottom of "open visual regression". -->
  <div style="display:flex; align-items:center; gap:14px;">
    <div style="width:6px; height:64px; background:var(--accent-primary);"></div>
    <div style="display:flex; flex-direction:column; gap:4px;">
      <div style="display:flex; align-items:center; gap:6px;">
        <span style="font-size:32px; font-weight:500; letter-spacing:-0.04em; line-height:1;">ovr</span>
        <span style="display:inline-block; width:14px; height:22px; background:var(--accent-primary);"></span>
      </div>
      <div class="label">open visual regression</div>
    </div>
  </div>

  <div style="width:1px; height:80px; background:var(--border-subtle);"></div>

  <!-- Mid + small monogram lockups (no cursor) -->
  <div style="display:flex; flex-direction:column; gap:10px;">
    <div style="display:flex; align-items:center; gap:10px;">
      <div style="width:4px; height:28px; background:var(--accent-primary);"></div>
      <span style="font-size:24px; font-weight:500; letter-spacing:-0.03em; line-height:1;">ovr</span>
    </div>
    <div style="display:flex; align-items:center; gap:7px;">
      <div style="width:3px; height:18px; background:var(--accent-primary);"></div>
      <span style="font-size:15px; font-weight:500; letter-spacing:-0.02em; line-height:1;">ovr</span>
    </div>
  </div>

  <div style="margin-left:auto; font-size:10px; color:var(--fg-tertiary); letter-spacing:0.08em; text-transform:uppercase; max-width:140px; line-height:1.5;">
    cursor only on the tagline lockup
  </div>
</div>
</div>
</body>
</html>
