<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>OVR — switch</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>html,body{height:220px;}</style>
</head>
<body>
<div class="card">

<div class="label">switch · 28×16 · slides 12px</div>
<div style="display:flex; flex-direction:column; gap:14px; font-size:12px;">
  <!-- on -->
  <label style="display:flex; align-items:center; gap:10px; cursor:pointer;">
    <span style="width:28px; height:16px; background:var(--accent-primary); border-radius:2px; position:relative; flex-shrink:0;">
      <span style="position:absolute; top:2px; left:14px; width:12px; height:12px; background:var(--fg-on-accent); border-radius:1px;"></span>
    </span>
    <span style="flex:1;">auto-approve PRs from trusted bots</span>
    <span style="font-size:10px; color:var(--accent-primary); font-weight:600; letter-spacing:0.08em; text-transform:uppercase;">on</span>
  </label>
  <!-- off -->
  <label style="display:flex; align-items:center; gap:10px; cursor:pointer;">
    <span style="width:28px; height:16px; background:var(--bg-inset); border:1px solid var(--border-default); border-radius:2px; position:relative; flex-shrink:0;">
      <span style="position:absolute; top:1px; left:1px; width:12px; height:12px; background:var(--fg-tertiary); border-radius:1px;"></span>
    </span>
    <span style="flex:1;">notify on baseline updates</span>
    <span style="font-size:10px; color:var(--fg-muted); font-weight:600; letter-spacing:0.08em; text-transform:uppercase;">off</span>
  </label>
  <!-- disabled -->
  <label style="display:flex; align-items:center; gap:10px; color:var(--fg-muted); cursor:not-allowed;">
    <span style="width:28px; height:16px; background:var(--bg-inset); border:1px solid var(--border-subtle); border-radius:2px; position:relative; flex-shrink:0;">
      <span style="position:absolute; top:1px; left:1px; width:12px; height:12px; background:var(--fg-muted); border-radius:1px;"></span>
    </span>
    <span style="flex:1;">block merges on regression</span>
    <span style="font-size:10px; color:var(--fg-muted); font-weight:600; letter-spacing:0.08em; text-transform:uppercase;">locked</span>
  </label>
</div>

</div>
</body>
</html>
