<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>OVR — inputs</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>html,body{height:200px;}</style>
</head>
<body>
<div class="card">

<div class="label">inputs · 32px · 2px radius</div>
<div style="display:flex; flex-direction:column; gap:12px; max-width:480px;">
  <div style="display:flex; flex-direction:column; gap:4px;">
    <label style="font-size:10px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--fg-secondary);">project name</label>
    <input value="checkout-flow" style="height:32px; padding:0 10px; background:var(--bg-elevated); border:1px solid var(--border-default); border-radius:2px; color:var(--fg-primary); font-family:inherit; font-size:12px;">
  </div>
  <div style="display:flex; flex-direction:column; gap:4px;">
    <label style="font-size:10px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--fg-secondary);">baseline branch</label>
    <input value="main" style="height:32px; padding:0 10px; background:var(--bg-elevated); border:1px solid var(--accent-primary); border-radius:2px; color:var(--fg-primary); font-family:inherit; font-size:12px; outline:2px solid var(--accent-primary-ring); outline-offset:0;">
    <span style="font-size:10px; color:var(--fg-tertiary);">focused state</span>
  </div>
</div>

</div>
</body>
</html>
