<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>OVR — mark on surfaces</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>html,body{height:150px;}</style>
</head>
<body>
<div class="card">
<div class="card-row" style="gap:0; flex:1;">
  <!-- on base -->
  <div style="flex:1; height:110px; background:var(--bg-base); display:flex; align-items:center; justify-content:center; gap:8px; border:1px solid var(--border-subtle);">
    <div style="width:5px; height:34px; background:var(--accent-primary);"></div>
    <span style="font-size:28px; font-weight:500; letter-spacing:-0.03em; color:var(--fg-primary);">ovr</span>
  </div>
  <!-- on elevated -->
  <div style="flex:1; height:110px; background:var(--bg-elevated); display:flex; align-items:center; justify-content:center; gap:8px; border:1px solid var(--border-subtle); border-left:0;">
    <div style="width:5px; height:34px; background:var(--accent-primary);"></div>
    <span style="font-size:28px; font-weight:500; letter-spacing:-0.03em; color:var(--fg-primary);">ovr</span>
  </div>
  <!-- on light -->
  <div style="flex:1; height:110px; background:#fafafa; display:flex; align-items:center; justify-content:center; gap:8px; border:1px solid var(--border-subtle); border-left:0;">
    <div style="width:5px; height:34px; background:var(--accent-primary);"></div>
    <span style="font-size:28px; font-weight:500; letter-spacing:-0.03em; color:#101013;">ovr</span>
  </div>
  <!-- on accent (mark inverts to fg) -->
  <div style="flex:1; height:110px; background:var(--accent-primary); display:flex; align-items:center; justify-content:center; gap:8px; border:1px solid var(--border-subtle); border-left:0;">
    <div style="width:5px; height:34px; background:#101013;"></div>
    <span style="font-size:28px; font-weight:500; letter-spacing:-0.03em; color:#101013;">ovr</span>
  </div>
</div>
<div style="display:flex; gap:0; font-size:10px; color:var(--fg-tertiary); letter-spacing:0.08em; text-transform:uppercase;">
  <div style="flex:1; text-align:center;">on base</div>
  <div style="flex:1; text-align:center;">on elevated</div>
  <div style="flex:1; text-align:center;">on light</div>
  <div style="flex:1; text-align:center;">on accent</div>
</div>
</div>
</body>
</html>
