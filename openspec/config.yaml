schema: spec-driven

context: |
  # OVR — Open Visual Regression

  Self-hosted visual regression testing platform for Storybook.
  CI sends a Storybook build to the OVR CLI → worker captures screenshots → Pixelmatch diffs → review queue.

  ## Monorepo layout

  apps/web               Next.js 15 App Router — UI, Server Actions, auth
  apps/worker            BullMQ consumer — Playwright capture, Pixelmatch diff
  apps/cli               @ovr/cli npm package

  packages/db            Drizzle ORM schema + migrations + repositories
  packages/services      Business logic (no framework imports)
  packages/api           oRPC contracts only (`@orpc/contract` + Zod schemas); no handlers; imported by both web router and CLI client
  packages/queue         BullMQ job type definitions + producers
  packages/storage       RustFS / S3 client
  packages/ui            Design system (shadcn + Base UI + OVR primitives)
  packages/typescript-config  Shared TS config (@ovr/typescript-config)

  ## Tech stack

  TypeScript 6 strict · pnpm workspaces · Turborepo
  Next.js 15 App Router · React 19
  Better Auth with Admin, API Key, Organization, Rate Limiting plugins
  Drizzle ORM · PostgreSQL · BullMQ · Valkey · RustFS (S3-compatible)
  Tailwind CSS v4 · shadcn/ui + Base UI React · CVA · clsx · tailwind-merge
  Vitest · Testcontainers · oxlint · oxfmt
  oRPC (CLI API transport) · Playwright (screenshot capture) · Pixelmatch (diffing)
  Sonner (toasts) · Tanstack Query (client polling) · Zod (validation)

  ## Licensing

  This is an open source, self-hosted project — every dependency (npm package, container
  image, client library) must carry a license compatible with self-hosted open source
  redistribution (e.g. MIT, Apache-2.0, BSD, ISC). Avoid AGPL/SSPL/BSL, proprietary, or
  "free for non-commercial use" licenses, and anything requiring a paid license for
  self-hosted deployments.

  ## Architecture rules

  Route / Server Action → Service → Repository → Drizzle → Postgres
  oRPC Router           → Service → Repository → Drizzle → Postgres
  Worker Job            → Service → Repository → Drizzle → Postgres

  - Services own all business logic; no Next.js imports allowed in packages/services
  - Repositories contain only Drizzle queries; no business logic
  - RBAC enforced in service layer only (not routes, not UI)
  - apps/web imports `@ovr/api/contract` only (never handler implementations from packages/api)
  - `"use client"` only for state, event handlers, or browser APIs
  - Mutations: oRPC procedures with `"use server"` + `.actionable()` used directly as Server Actions — no `actions.ts` wrapper needed; client components call via `useServerAction` from `@orpc/react/hooks`
  - Data display: Server Components
  - Client-side polling: Tanstack Query

  ## Naming conventions

  All packages: `@ovr/*` scope
  DB columns: camelCase in Drizzle schema (maps to snake_case in SQL via Drizzle mode)
  URL paths: `/builds/[id]` — but UI labels always say "run"/"runs"
  oRPC mounted at: `/api/rpc/[...path]`
  API key prefix format: `ovr_pk_live_<random>` — shown once, stored as hash

  Package public API: export a single namespace object named for the package's role
  (e.g. `dbClient` from `@ovr/db`, `storage` from `@ovr/storage`) — not a grab-bag of
  top-level named exports. Other specs call these as `storage.getPresignedUrl(...)`,
  `dbClient.builds.create(...)`, etc.

  ## Testing conventions

  Integration tests: `src/__tests__/*.integration.test.ts` (flat — never a nested
  `integration/` subdirectory), run against real service containers via Testcontainers
  (never mocks). Reference implementation: `packages/db`.

  - `vitest.config.ts`: `globalSetup: ["./vitest.integration.globalSetup.ts"]`
  - `vitest.integration.globalSetup.ts` (package root, outside `src/`): exported `setup`/`teardown`
    function declarations (not arrows — the `func-style` lint rule only applies under `src/`);
    starts the container(s) once, sets env vars, runs migrations/seeds — all before any test
    file (and therefore the package's `index.ts`) is imported
  - Package-specific container starters live in `src/__tests__/helpers/containers.ts`
    (e.g. `startRustfs()`); prefer an official `@testcontainers/*` package, fall back to `GenericContainer`
  - The package's primary client/singleton is constructed eagerly at module scope from
    `process.env` (see `packages/db/src/db.ts`) — safe only because globalSetup sets env vars first
  - Per-test setup/teardown: `src/__tests__/fixtures.ts` exporting `test`/`describe`/`expect`
    via `vitest.extend<Fixtures>({...})` (see `packages/db/src/__tests__/fixtures.ts`)
  - Backend-only packages (no React/JSX, e.g. db/storage/queue/services): add a package-level
    `.oxlintrc.json` with `"plugins": ["typescript", "import", "unicorn", "vitest"]`
    (copy `packages/db/.oxlintrc.json`) — otherwise oxlint's `react-hooks/rules-of-hooks`
    misfires on the `use` callback in vitest fixtures

  ## Auth flow

  Roles: `admin` (manages users/projects/settings) and `user` (view/review diffs)
  First-run: middleware detects zero users → redirects all requests to /setup
  Invite: admin generates URL in admin UI (no email sent); 48h TTL, single-use
  Server Action for invite acceptance: createUser + signIn + acceptInvitation atomically
  CLI auth: Bearer API key verified via auth.api.verifyApiKey(); missing/invalid → UNAUTHORIZED

  ## Storage access pattern

  All assets (snapshots, diffs, storybook builds) in RustFS; no public bucket policy.
  Access: GET /api/storage/[...path] → validate session + project membership → presigned URL (60s TTL) → 302 redirect

  Use `rustfs/rustfs:latest` via Testcontainers' `GenericContainer` for storage
  integration tests; default credentials are `rustfsadmin` / `rustfsadmin`.

  ## Build pipeline

  createBuild (oRPC):
    → Build record (pending) + Snapshot records (one per story × variant)
    → Upload Storybook static to RustFS
    → Enqueue snapshot:capture jobs in parallel

  snapshot:capture job:
    → Playwright screenshot at configured viewport
    → Capture console output/errors → SnapshotLog
    → Upload screenshot to RustFS
    → Update Snapshot (captured)
    → All captures done? → enqueue snapshot:diff jobs

  snapshot:diff job:
    → Fetch capture + baseline from RustFS
    → Pixelmatch comparison
    → No baseline → needs_review
    → Within threshold → auto_approved
    → Exceeds threshold → needs_review + upload diff image
    → All diffs done? → enqueue build:finalize

  build:finalize job:
    → Any snapshot error → Build: error
    → Any diff needs_review → Build: needs_review
    → All diffs auto_approved or approved → Build: passed

  Baseline = most recent approved build on the project's default branch.
  Feature branch builds compare against default branch baseline (never against same-branch builds).
  Approving a diff on the default branch promotes that snapshot to new baseline.
  Feature branch approvals do not update baselines.

  Job retry policy:
    snapshot:capture — 5 attempts, exponential backoff 2s base
    snapshot:diff    — 3 attempts, exponential backoff 2s base
    build:finalize   — 3 attempts, fixed 1s backoff
  On exhaustion: worker catches BullMQ `failed` event, marks record as error, re-triggers finalization check.

  ## Design system reference

  Read these files before implementing ANY UI task:

    Tokens:      openspec/designs/screens/open-visual-regression/project/kit/colors_and_type.css
    Components:  openspec/designs/screens/open-visual-regression/project/kit/components.jsx
    Alerts:      openspec/designs/screens/open-visual-regression/project/kit/components-alerts.jsx
    Feedback:    openspec/designs/screens/open-visual-regression/project/kit/components-feedback.jsx
    Chrome:      openspec/designs/screens/open-visual-regression/project/kit/chrome.jsx
    Chrome mob:  openspec/designs/screens/open-visual-regression/project/kit/chrome-mobile.jsx
    Chrome tab:  openspec/designs/screens/open-visual-regression/project/kit/chrome-tablet.jsx
    Builds UI:   openspec/designs/screens/open-visual-regression/project/kit/screens-builds.jsx
    Auth UI:     openspec/designs/screens/open-visual-regression/project/kit/screens-auth.jsx
    Projects UI: openspec/designs/screens/open-visual-regression/project/kit/screens-projects.jsx
    Admin UI:    openspec/designs/screens/open-visual-regression/project/kit/screens-admin.jsx
    States UI:   openspec/designs/screens/open-visual-regression/project/kit/screens-states.jsx
    Mobile UI:   openspec/designs/screens/open-visual-regression/project/kit/screens-mobile.jsx
    Tablet UI:   openspec/designs/screens/open-visual-regression/project/kit/screens-tablet.jsx
    Fonts:       openspec/designs/design-system/ovr-design-system/project/fonts/

  Visual direction: dark-first · JetBrains Mono everywhere · hairline-dense · "a terminal you can click"

  Accent: warm amber oklch(0.78 0.18 75) — the one brand color. Used for CTAs, changed highlights, diff slider.

  Status icons (Lucide React, strokeWidth=1.5, strokeLinecap="square", strokeLinejoin="miter", 14–16px):
    changed / needs_review → AlertCircle     color: --ovr-accent-primary  (amber)
    passed                 → CircleCheck     color: --ovr-diff-add        (green)
    pending / running      → LoaderCircle    color: --ovr-status-pending  (blue)
    stale                  → TriangleAlert   color: --ovr-fg-muted        (grey)
    approved (diff-level)  → CircleCheck     color: --ovr-diff-add        (green)
    rejected (diff-level)  → CircleX         color: --ovr-diff-remove     (red)
    Δ stays as unicode text prefix before percentages — e.g. "Δ 0.12%"

  Build status DB → UI:
    pending      → "running…" + LoaderCircle (blue)
    needs_review → "N changed" + AlertCircle (amber)
    passed       → "pass" + CircleCheck (green)
    error        → "fail" + AlertCircle (red)

  Radii: 2px buttons/badges/inputs · 4px cards/panels · 6px modals. No capsule shapes.
  Borders: 1px hairline. --ovr-border-subtle for table rules · --ovr-border-default for card edges · --ovr-border-strong for focus.

  Responsive breakpoints:
    Desktop  ≥1024px  48px topbar + 240px fixed sidebar
    Tablet   768–1023 48px topbar + 48px collapsed icon-only sidebar (2-letter monograms, amber dot for changed)
    Mobile   <768px   48px topbar + hamburger → 280px drawer + 56px bottom tab bar (projects · runs · settings)

  CSS variables: --topbar-h: 48px · --sidebar-w: 240px

  Diff viewer modes:
    side    — baseline + current ~320px each, region overlays per side
    overlay — single full-width frame, all diff regions overlaid (40% opacity, 2px outline)
    slider  — draggable 2px amber vertical divider with 28×28 ↔ handle, clip-path split

  Keyboard shortcuts in diff viewer: J=next changed · K=prev changed · A=approve · R=reject
  Shown as KeyHint chips in footer.

  DiffStrip: 3px left-edge bar on run rows and run detail headers.
    amber=changed · green=pass · red=fail/error · blue=pending · grey=stale

  Settings layout: 200px sub-nav rail + scrollable content area.
    Personal: profile · api keys · sessions
    Admin:    users · invitations · instance

  Empty states: 1px dashed border + --pixel-grid background texture + ∅ glyph + text + primary CTA.

  Toast: bottom-right fixed, stacked. Tones: success (green border) · accent (amber border) · neutral.
  Alert: inline banner. Tones: success · accent · destructive · neutral.

  Copy voice: terse, lowercase, mechanical. No emoji, no exclamation marks.
  Status badges uppercase (PASS · FAIL · PENDING · CHANGED). Buttons and nav lowercase.

rules:
  tasks:
    - Each task must be independently verifiable via a passing test or visible UI output
    - No PR should exceed more than 400 changed lines. If it exceeds this, break it down into smaller PRs.
    - Tasks are ordered by dependency — complete in sequence within each change
    - Read the relevant design files before implementing any UI component
    - Integration tests use Testcontainers with real service containers (not mocks)
    - Do not add any comments
    - Use the skills defined in the project
    - Architect the components so that they are composible
    - Avoid arbitrary Tailwind values unless absolutely necessary
    - When adding new dependencies (npm packages, container images, client libraries), verify
      the license permits self-hosted open source redistribution (avoid AGPL/SSPL/BSL or
      proprietary licenses)
    - New backend-only packages (no React/JSX) need a package-level .oxlintrc.json matching packages/db
    - When adding new npm dependencies, pin to a version at least ~2 weeks old to avoid pnpm's
      minimumReleaseAge check auto-editing pnpm-workspace.yaml's minimumReleaseAgeExclude
