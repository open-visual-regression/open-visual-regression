name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}

  check-types:
    name: Type check
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@ovr/web...
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      - run: pnpm check-types

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:ci

  format-check:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format -- --check

  build-storybook:
    name: Publish Storybook to Open Visual Regression (${{ matrix.package.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - { name: ui, filter: "@ovr/ui" }
          - { name: web, filter: "@ovr/web" }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build-storybook --filter=${{ matrix.package.filter }} --affected
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Publish snapshot to OVR (ui)
        if: matrix.package.name == 'ui' && hashFiles('packages/ui/storybook-static/**') != ''
        continue-on-error: true
        env:
          OVR_API_KEY: ${{ secrets.OVR_API_KEY_UI }}
        run: >
          pnpm --filter ${{ matrix.package.filter }} exec ovr snapshot storybook
          --dir storybook-static
          --server-url https://openvisualregression.com
          --branch "${{ github.head_ref || github.ref_name }}"
          --commit "${{ github.event.pull_request.head.sha || github.sha }}"
          --name "$(git log -1 --pretty=%s)"
          --author "$(git log -1 --pretty=%an)"
      - name: Publish snapshot to OVR (web)
        if: matrix.package.name == 'web' && hashFiles('apps/web/storybook-static/**') != ''
        continue-on-error: true
        env:
          OVR_API_KEY: ${{ secrets.OVR_API_KEY_WEB }}
        run: >
          pnpm --filter ${{ matrix.package.filter }} exec ovr snapshot storybook
          --dir storybook-static
          --server-url https://openvisualregression.com
          --branch "${{ github.head_ref || github.ref_name }}"
          --commit "${{ github.event.pull_request.head.sha || github.sha }}"
          --name "$(git log -1 --pretty=%s)"
          --author "$(git log -1 --pretty=%an)"

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: open_visual_regression
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/open_visual_regression
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ovr/db db:migrate
      - run: pnpm --filter @ovr/capture exec playwright install --with-deps chromium
      - run: pnpm test

  storybook-compat:
    name: Storybook compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Each fixture is a standalone Storybook install, so the cache is keyed on
      # the fixture lockfiles: it only misses when a pinned version changes.
      - name: Restore Storybook fixture builds
        id: fixtures
        uses: actions/cache@v4
        with:
          path: |
            packages/storybook-compat/fixtures/*/node_modules
            packages/storybook-compat/fixtures/*/storybook-static
          key: storybook-fixtures-${{ runner.os }}-${{ hashFiles('packages/storybook-compat/fixtures/**/package.json', 'packages/storybook-compat/fixtures/stories/**') }}
      - name: Build the Storybook fixtures
        run: pnpm --filter @ovr/storybook-compat fixtures:build
      - run: pnpm --filter @ovr/capture exec playwright install --with-deps chromium
      - name: Run the compatibility suite
        env:
          # Turn a missing fixture into a failure rather than a silent skip.
          OVR_REQUIRE_STORYBOOK_FIXTURES: "1"
        run: |
          pnpm turbo run test --filter=@ovr/storybook-compat
          pnpm turbo run build --filter=@ovr/capture...
          pnpm --filter @ovr/capture exec vitest run src/__tests__/storybookVersions.integration.test.ts

  docker:
    needs: [build, check-types, lint, format-check, test, storybook-compat]
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: web, dockerfile: apps/web/Dockerfile }
          - { name: worker, dockerfile: apps/worker/Dockerfile }
    uses: docker/github-builder/.github/workflows/build.yml@v1
    with:
      job-name-prefix: "${{ matrix.image.name }} "
      output: image
      push: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
      platforms: linux/amd64,linux/arm64
      context: .
      file: ${{ matrix.image.dockerfile }}
      meta-images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}
      meta-tags: |
        type=ref,event=branch
        type=ref,event=pr
        type=sha,prefix=sha-
        type=raw,value=ci-${{ github.run_id }}
      cache: true
      cache-scope: ${{ matrix.image.name }}
      cache-mode: max
      sbom: true
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  promote:
    name: Promote release (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [docker, e2e]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [web, worker]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Detect release commit
        id: release
        run: |
          current=$(jq -r .version apps/web/package.json)
          previous=$(git show "HEAD^:apps/web/package.json" | jq -r .version)
          if [ "$current" = "$previous" ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
          else
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=$current" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v4
        if: steps.release.outputs.released == 'true'
      - name: Log in to GHCR
        if: steps.release.outputs.released == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Release metadata
        id: meta
        if: steps.release.outputs.released == 'true'
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.release.outputs.version }}
            type=raw,value=latest
      - name: Promote the tested image
        if: steps.release.outputs.released == 'true'
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            "$IMAGE:ci-${{ github.run_id }}"

  e2e:
    name: E2E
    needs: [docker]
    if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/e2e.yml
    with:
      mode: pull
      image_prefix: ghcr.io/${{ github.repository_owner }}
      image_tag: ci-${{ github.run_id }}
