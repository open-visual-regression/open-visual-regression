name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}

  check-types:
    name: Type check
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@ovr/web...
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      - run: pnpm check-types

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:ci

  format-check:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format -- --check

  build-storybook:
    name: Publish Storybook to Open Visual Regression (${{ matrix.package.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - { name: ui, filter: "@ovr/ui" }
          - { name: web, filter: "@ovr/web" }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build-storybook --filter=${{ matrix.package.filter }} --affected
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Publish snapshot to OVR (ui)
        if: matrix.package.name == 'ui' && hashFiles('packages/ui/storybook-static/**') != ''
        continue-on-error: true
        env:
          OVR_API_KEY: ${{ secrets.OVR_API_KEY_UI }}
        run: >
          pnpm --filter ${{ matrix.package.filter }} exec ovr snapshot storybook
          --dir storybook-static
          --server-url https://openvisualregression.com
          --branch "${{ github.head_ref || github.ref_name }}"
          --commit "${{ github.event.pull_request.head.sha || github.sha }}"
          --name "$(git log -1 --pretty=%s)"
          --author "$(git log -1 --pretty=%an)"
      - name: Publish snapshot to OVR (web)
        if: matrix.package.name == 'web' && hashFiles('apps/web/storybook-static/**') != ''
        continue-on-error: true
        env:
          OVR_API_KEY: ${{ secrets.OVR_API_KEY_WEB }}
        run: >
          pnpm --filter ${{ matrix.package.filter }} exec ovr snapshot storybook
          --dir storybook-static
          --server-url https://openvisualregression.com
          --branch "${{ github.head_ref || github.ref_name }}"
          --commit "${{ github.event.pull_request.head.sha || github.sha }}"
          --name "$(git log -1 --pretty=%s)"
          --author "$(git log -1 --pretty=%an)"

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: open_visual_regression
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/open_visual_regression
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ovr/db db:migrate
      - run: pnpm --filter @ovr/capture exec playwright install --with-deps chromium
      - run: pnpm test

  docker:
    name: Docker image (${{ matrix.image.name }} ${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    needs: [build, check-types, lint, format-check, test]
    permissions:
      contents: read
      packages: write
    env:
      SHOULD_PUSH: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: web, dockerfile: apps/web/Dockerfile }
          - { name: worker, dockerfile: apps/worker/Dockerfile }
        platform:
          - { arch: amd64, target: linux/amd64, runner: ubuntu-latest }
          - { arch: arm64, target: linux/arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: env.SHOULD_PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
      - name: Build image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: ${{ matrix.platform.target }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: ${{ env.SHOULD_PUSH == 'true' && format('type=image,name=ghcr.io/{0}/{1},push-by-digest=true,name-canonical=true,push=true', github.repository_owner, matrix.image.name) || 'type=cacheonly' }}
          provenance: ${{ env.SHOULD_PUSH == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ env.SHOULD_PUSH == 'true' }}
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
      - name: Export digest
        if: env.SHOULD_PUSH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - name: Upload digest
        if: env.SHOULD_PUSH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge manifest (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [docker]
    if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [web, worker]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=ci-${{ github.run_id }}
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
      - name: Inspect image
        run: docker buildx imagetools inspect "$IMAGE:ci-${{ github.run_id }}"

  promote:
    name: Promote release (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [merge, e2e]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [web, worker]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Detect release commit
        id: release
        run: |
          current=$(jq -r .version apps/web/package.json)
          previous=$(git show "HEAD^:apps/web/package.json" | jq -r .version)
          if [ "$current" = "$previous" ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
          else
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=$current" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v4
        if: steps.release.outputs.released == 'true'
      - name: Log in to GHCR
        if: steps.release.outputs.released == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Release metadata
        id: meta
        if: steps.release.outputs.released == 'true'
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.release.outputs.version }}
            type=raw,value=latest
      - name: Promote the tested image
        if: steps.release.outputs.released == 'true'
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            "$IMAGE:ci-${{ github.run_id }}"

  e2e:
    name: E2E
    needs: [merge]
    if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/e2e.yml
    with:
      mode: pull
      image_prefix: ghcr.io/${{ github.repository_owner }}
      image_tag: ci-${{ github.run_id }}
