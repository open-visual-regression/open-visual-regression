name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}

  check-types:
    name: Type check
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@ovr/web...
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      - run: pnpm check-types

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:ci

  format-check:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format -- --check

  build-storybook:
    name: Publish Storybook to Open Visual Regression (${{ matrix.package.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - { name: ui, filter: "@ovr/ui" }
          - { name: web, filter: "@ovr/web" }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build-storybook --filter=${{ matrix.package.filter }} --affected
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Publish snapshot to OVR (ui)
        if: matrix.package.name == 'ui' && hashFiles('packages/ui/storybook-static/**') != ''
        continue-on-error: true
        env:
          OVR_API_KEY: ${{ secrets.OVR_API_KEY_UI }}
        run: >
          pnpm --filter ${{ matrix.package.filter }} exec ovr snapshot storybook
          --dir storybook-static
          --server-url https://openvisualregression.com
          --branch "${{ github.head_ref || github.ref_name }}"
          --commit "${{ github.event.pull_request.head.sha || github.sha }}"
          --name "$(git log -1 --pretty=%s)"
          --author "$(git log -1 --pretty=%an)"
      - name: Publish snapshot to OVR (web)
        if: matrix.package.name == 'web' && hashFiles('apps/web/storybook-static/**') != ''
        continue-on-error: true
        env:
          OVR_API_KEY: ${{ secrets.OVR_API_KEY_WEB }}
        run: >
          pnpm --filter ${{ matrix.package.filter }} exec ovr snapshot storybook
          --dir storybook-static
          --server-url https://openvisualregression.com
          --branch "${{ github.head_ref || github.ref_name }}"
          --commit "${{ github.event.pull_request.head.sha || github.sha }}"
          --name "$(git log -1 --pretty=%s)"
          --author "$(git log -1 --pretty=%an)"

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: open_visual_regression
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/open_visual_regression
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ovr/db db:migrate
      - run: pnpm --filter @ovr/capture exec playwright install --with-deps chromium
      - run: pnpm test

  docker:
    name: Docker image (${{ matrix.image.name }})
    runs-on: ubuntu-latest
    needs: [build, check-types, lint, format-check, test]
    if: github.ref_type != 'tag'
    permissions:
      contents: read
      packages: write
    env:
      SHOULD_PUSH: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: web, dockerfile: apps/web/Dockerfile }
          - { name: worker, dockerfile: apps/worker/Dockerfile }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        if: env.SHOULD_PUSH == 'true'
      - uses: docker/setup-buildx-action@v4
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=ci-${{ github.run_id }}
      - name: Log in to GHCR
        if: env.SHOULD_PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: ${{ env.SHOULD_PUSH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.SHOULD_PUSH == 'true' }}
          load: ${{ env.SHOULD_PUSH != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: ${{ env.SHOULD_PUSH == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ env.SHOULD_PUSH == 'true' }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

  promote:
    name: Promote image (${{ matrix.image }})
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [web, worker]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Release metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
      - name: Promote the tested image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          source="$IMAGE:sha-${GITHUB_SHA::7}"
          for _ in $(seq 1 60); do
            docker buildx imagetools inspect "$source" >/dev/null 2>&1 && break
            sleep 30
          done
          if ! docker buildx imagetools inspect "$source" >/dev/null 2>&1; then
            echo "::error::$source was never published; refusing to release an untested image"
            exit 1
          fi
          args=""
          while IFS= read -r tag; do
            [ -n "$tag" ] && args="$args --tag $tag"
          done <<< "$TAGS"
          docker buildx imagetools create $args "$source"

  e2e:
    name: E2E
    needs: [docker]
    if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/e2e.yml
    with:
      mode: pull
      image_prefix: ghcr.io/${{ github.repository_owner }}
      image_tag: ci-${{ github.run_id }}
