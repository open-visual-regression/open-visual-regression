name: Chart

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: chart-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  HELM_VERSION: v3.16.3
  KUBECONFORM_VERSION: v0.6.7

jobs:
  detect-changes:
    name: Detect chart changes
    runs-on: ubuntu-latest
    outputs:
      charts_changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "no usable base commit, linting the chart"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE_SHA...HEAD" -- charts ct.yaml .github/workflows/chart.yml)
          echo "changed chart files: ${files:-none}"
          changed=$([ -n "$files" ] && echo true || echo false)
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint and render
    needs: [detect-changes]
    if: needs.detect-changes.outputs.charts_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          check-latest: true

      - uses: helm/chart-testing-action@v2.8.0

      - name: Lint
        run: ct lint --all

      - name: Install kubeconform
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: Render every permutation
        run: |
          set -euo pipefail
          mkdir -p rendered
          for f in charts/ovr/ci/*-values.yaml; do
            name=$(basename "$f" -values.yaml)
            echo "::group::helm template ($name)"
            helm template ovr-app charts/ovr --values "$f" > "rendered/$name.yaml"
            head -n 5 "rendered/$name.yaml"
            echo "::endgroup::"
          done

      - name: Validate rendered manifests
        run: |
          kubeconform -strict -summary -verbose \
            -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered/*.yaml

      - name: Schema rejects bad values
        run: |
          fails() {
            if helm template ovr-app charts/ovr --set existingSecret=s "$@" >/dev/null 2>&1; then
              echo "::error::values.schema.json accepted $*"; exit 1
            fi
            echo "correctly rejected: $*"
          }
          fails --set worker.concurency=4
          fails --set web.ingress.enabled=yes
          fails --set web.updateStrategy=Rolling

      - name: Package
        run: helm package charts/ovr --destination dist && ls -l dist
