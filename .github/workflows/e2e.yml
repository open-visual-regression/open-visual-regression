name: E2E

on:
  workflow_call:
    inputs:
      mode:
        description: "How to obtain the stack: 'build' from source or 'pull' published images"
        type: string
        default: build
      image_prefix:
        description: "Registry prefix for the published web and worker images"
        type: string
        default: ""
      image_tag:
        description: "Tag for the published web and worker images"
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      mode:
        description: "How to obtain the stack"
        type: choice
        options: [build, pull]
        default: build

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: ${{ matrix.name }} (${{ inputs.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: E2E
            base_url: http://localhost:3000
            compose_args: ""
            test_script: test:e2e
            build_artifacts: true
            artifact_suffix: ""
          - name: E2E SSO
            base_url: http://localhost:4180
            compose_args: --env-file apps/e2e/sso/sso.env --profile sso
            test_script: test:e2e:sso
            build_artifacts: false
            artifact_suffix: -sso
    env:
      PLAYWRIGHT_BASE_URL: ${{ matrix.base_url }}
      COMPOSE: docker compose --env-file .env ${{ matrix.compose_args }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Write ephemeral compose secrets
        run: |
          {
            echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)"
            echo "OVR_GIT_TOKEN_ENCRYPTION_KEY=$(openssl rand -base64 32)"
          } >> .env
      - name: Log in to GHCR
        if: inputs.mode == 'pull'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start the stack (published images)
        if: inputs.mode == 'pull'
        env:
          IMAGE_PREFIX: ${{ inputs.image_prefix || format('ghcr.io/{0}', github.repository_owner) }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          export IMAGE_TAG="${IMAGE_TAG:-sha-${GITHUB_SHA::7}}"
          $COMPOSE pull --quiet
          $COMPOSE up -d
      - name: Start the stack (build from source)
        if: inputs.mode == 'build'
        run: $COMPOSE up -d --build
      - name: Wait for the web app
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS "$PLAYWRIGHT_BASE_URL/api/rpc/health/ready" >/dev/null 2>&1; then
              echo "web is up"
              exit 0
            fi
            sleep 5
          done
          echo "web did not become ready" >&2
          $COMPOSE logs --no-color
          exit 1
      - name: Build the artifacts to ingest
        if: matrix.build_artifacts
        run: |
          pnpm --filter @ovr/ui build-storybook
          pnpm --filter @open-visual-regression/cli build
      - name: Install Playwright browser
        run: pnpm --filter @ovr/e2e exec playwright install --with-deps chromium
      - name: Run E2E tests
        run: pnpm --filter @ovr/e2e ${{ matrix.test_script }}
      - name: Dump stack logs on failure
        if: failure()
        run: $COMPOSE logs --no-color
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report${{ matrix.artifact_suffix }}
          path: apps/e2e/playwright-report/
          retention-days: 30
          if-no-files-found: ignore
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results${{ matrix.artifact_suffix }}
          path: apps/e2e/test-results/
          retention-days: 30
          if-no-files-found: ignore
      - name: Stop the stack
        if: always()
        run: $COMPOSE down -v
