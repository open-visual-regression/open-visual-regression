{{- if .Values.githubApp.privateKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ovr.githubAppSecretName" . }}
  labels:
    {{- include "ovr.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.githubApp.existingSecretKey }}: {{ .Values.githubApp.privateKey | quote }}
{{- end }}
