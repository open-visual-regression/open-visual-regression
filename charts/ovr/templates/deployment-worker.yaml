{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ovr.fullname" . }}-worker
  labels:
    {{- include "ovr.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  {{- if not (or .Values.worker.autoscaling.enabled .Values.worker.keda.enabled) }}
  # Omitted while an autoscaler owns the replica count.
  replicas: {{ .Values.worker.replicas }}
  {{- end }}
  # RollingUpdate needs 2x this pod's requests free on its node; use Recreate otherwise.
  strategy:
    type: {{ .Values.worker.updateStrategy | default "RollingUpdate" }}
  selector:
    matchLabels:
      {{- include "ovr.selectorLabels" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" "worker") | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- include "ovr.configChecksums" . | nindent 8 }}
      labels:
        {{- include "ovr.selectorLabels" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" "worker") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "ovr.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "ovr.image" (dict "Values" .Values "Chart" .Chart "name" "worker" "tag" .Values.worker.image.tag "digest" .Values.worker.image.digest "override" .Values.worker.image.override) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml (default .Values.containerSecurityContext .Values.worker.containerSecurityContext) | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "ovr.fullname" . }}-config
            - secretRef:
                name: {{ include "ovr.secretName" . }}
          env:
            - name: OVR_CAPTURE_GROUP_CONCURRENCY
              value: {{ .Values.worker.concurrency | quote }}
            {{- with .Values.worker.groupSize }}
            - name: OVR_CAPTURE_GROUP_SIZE
              value: {{ . | quote }}
            {{- end }}
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.worker.shmSize }}
{{- end }}
