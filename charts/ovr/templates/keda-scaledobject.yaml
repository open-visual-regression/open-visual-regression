{{- if and .Values.worker.enabled .Values.worker.keda.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "ovr.fullname" . }}-worker
  labels:
    {{- include "ovr.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  scaleTargetRef:
    name: {{ include "ovr.fullname" . }}-worker
  minReplicaCount: {{ .Values.worker.keda.minReplicaCount }}
  maxReplicaCount: {{ .Values.worker.keda.maxReplicaCount }}
  pollingInterval: {{ .Values.worker.keda.pollingInterval }}
  cooldownPeriod: {{ .Values.worker.keda.cooldownPeriod }}
  {{- with .Values.worker.keda.advanced }}
  advanced:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  triggers:
    {{- with .Values.worker.keda.triggers }}
    {{- toYaml . | nindent 4 }}
    {{- else }}
    {{- $cluster := eq .Values.redis.mode "cluster" }}
    - type: {{ ternary "redis-cluster" "redis" $cluster }}
      metadata:
        {{ ternary "addresses" "address" $cluster }}: {{ required "worker.keda.redisAddress is required when worker.keda.enabled is true (or set worker.keda.triggers)" .Values.worker.keda.redisAddress | quote }}
        listName: {{ printf "%s:snapshot-capture:wait" (ternary "{bull}" "bull" $cluster) | quote }}
        listLength: {{ .Values.worker.keda.listLength | quote }}
      {{- with .Values.worker.keda.authenticationRef }}
      authenticationRef:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
{{- end }}
