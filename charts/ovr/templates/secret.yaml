{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ovr.secretName" . }}
  labels:
    {{- include "ovr.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "database.url is required (or set existingSecret)" .Values.database.url | quote }}
  REDIS_URL: {{ required "redis.url is required (or set existingSecret)" .Values.redis.url | quote }}
  BETTER_AUTH_SECRET: {{ required "auth.betterAuthSecret is required — generate with: openssl rand -base64 32 (or set existingSecret)" .Values.auth.betterAuthSecret | quote }}
  OVR_GIT_TOKEN_ENCRYPTION_KEY: {{ required "auth.gitTokenEncryptionKey is required — generate with: openssl rand -base64 32 (or set existingSecret)" .Values.auth.gitTokenEncryptionKey | quote }}
  {{- with .Values.storage.accessKey }}
  STORAGE_ACCESS_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.storage.secretKey }}
  STORAGE_SECRET_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.githubApp }}
  {{- if or .appId .privateKey }}
  OVR_GITHUB_APP_ID: {{ required "githubApp.appId is required when githubApp.privateKey is set" .appId | toString | quote }}
  OVR_GITHUB_APP_PRIVATE_KEY: {{ required "githubApp.privateKey is required when githubApp.appId is set" .privateKey | quote }}
  {{- end }}
  {{- end }}
{{- end }}
