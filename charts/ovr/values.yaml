# Requires a Postgres database, a Redis-compatible instance, and an
# S3-compatible bucket already reachable from the cluster. This chart runs none
# of them — use managed services (Neon, RDS, AWS S3, R2) or deploy your own.

# Overrides the generated resource name prefix (default: release name alone).
nameOverride: ""
fullnameOverride: ""

image:
  registry: ghcr.io/open-visual-regression
  # Empty uses the chart's appVersion. Set to pin a different tag.
  tag: ""
  # Pin an exact digest (sha256:...). Takes precedence over tag when set —
  # deploy exactly what you tested, and roll pods only when it changes.
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Name of a Secret you create yourself with keys: DATABASE_URL, REDIS_URL,
# BETTER_AUTH_SECRET, OVR_GIT_TOKEN_ENCRYPTION_KEY, STORAGE_ACCESS_KEY,
# STORAGE_SECRET_KEY. Set this to use your own secret instead of the values
# below (recommended if using GitOps / Sealed Secrets / External Secrets).
existingSecret: ""

# Annotate for IRSA/Workload Identity to bind a cloud IAM role instead of static keys.
serviceAccount:
  create: true
  # Defaults to the release name.
  name: ""
  annotations: {}
  # Nothing here calls the API server, so no token is mounted.
  automountServiceAccountToken: false

# The images set USER by name (nextjs / pwuser), which the kubelet cannot
# verify against runAsNonRoot — it needs a numeric UID. Both resolve to 1001,
# matching the UID/GID build args in the app's Dockerfiles.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001

# Shared default; components below can override. readOnlyRootFilesystem stays false (both write scratch files).
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: false
  seccompProfile:
    type: RuntimeDefault

env:
  # Public URL the app will be served at.
  baseUrl: "https://ovr.example.com"
  logLevel: info

auth:
  # Generate: openssl rand -base64 32
  betterAuthSecret: ""
  # Generate: openssl rand -base64 32
  gitTokenEncryptionKey: ""

database:
  url: "" # postgresql://user:pass@host:5432/open_visual_regression

redis:
  url: "" # redis://host:6379

storage:
  # Leave endpoint/publicEndpoint empty and forcePathStyle false for AWS S3.
  # Set them (and forcePathStyle true) for MinIO, rustfs, R2, etc.
  endpoint: ""
  publicEndpoint: ""
  region: us-east-1
  bucket: ovr
  forcePathStyle: false
  accessKey: ""
  secretKey: ""

web:
  enabled: true
  replicas: 1
  port: 3000
  resources: {}
  # Empty inherits the shared containerSecurityContext above.
  containerSecurityContext: {}
  # RollingUpdate needs 2x this component's requests free on its node during rollout.
  updateStrategy: RollingUpdate
  nodeSelector: {}
  tolerations: []
  affinity: {}
  image:
    tag: ""
    digest: ""
    override: "" # full image reference; takes precedence over tag/digest above
  service:
    type: ClusterIP
    port: 3000
  ingress:
    enabled: false
    className: ""
    host: ovr.example.com
    annotations: {}
    tls: []
    # Redirect plain HTTP to HTTPS when tls is set. Supported for className
    # traefik and nginx; other controllers need their own redirect config.
    redirectHttps: true
  priorityClassName: ""
  # Spread constraints, passed through verbatim. Include a labelSelector
  # matching this component -- the chart does not inject one:
  #
  #   topologySpreadConstraints:
  #     - maxSkew: 1
  #       topologyKey: topology.kubernetes.io/zone
  #       whenUnsatisfiable: ScheduleAnyway
  #       labelSelector:
  #         matchLabels:
  #           app.kubernetes.io/name: ovr
  #           app.kubernetes.io/component: web
  topologySpreadConstraints: []
  podDisruptionBudget:
    enabled: false
    # Set exactly one of these. Either may be a count or a percentage.
    # minAvailable: 1 against a single replica blocks node drains outright.
    maxUnavailable: 1
    minAvailable: ""
  # Requires resources.requests to be set -- utilization is a percentage of
  # the request, so an HPA on a container without one never scales.
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: ""
    # Additional autoscaling/v2 metrics, appended verbatim.
    metrics: []
    behavior: {}

worker:
  enabled: true
  replicas: 1
  concurrency: 2
  # Snapshots per capture-group job. Each group holds one browser for up to
  # 2 minutes per snapshot, so this also sets how long a stuck group runs
  # before its timeout fires. Empty uses the app default (10).
  groupSize: ""
  resources: {}
  # Omits seccompProfile: Chromium runs with its own sandbox (no --no-sandbox),
  # which RuntimeDefault seccomp blocks. Not admissible to a `restricted`
  # namespace without also adding --no-sandbox to the app's launch args.
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    readOnlyRootFilesystem: false
  # RollingUpdate needs 2x this component's requests free on its node during rollout.
  updateStrategy: RollingUpdate
  # A capture-group job holds one browser open across its snapshots; the k8s
  # default (30s) SIGKILLs the pod mid-capture on every rollout, permanently
  # failing whatever snapshot was in flight. Give it real time to finish the
  # current snapshot and let BullMQ hand the rest of the group to the next pod.
  terminationGracePeriodSeconds: 180
  nodeSelector: {}
  tolerations: []
  affinity: {}
  image:
    tag: ""
    digest: ""
    override: ""
  # Chromium needs real /dev/shm; the k8s default (64Mi) crashes on non-trivial
  # pages. Mounted as an in-memory emptyDir.
  shmSize: 1Gi
  priorityClassName: ""
  # Spread constraints, passed through verbatim. Include a labelSelector
  # matching this component -- the chart does not inject one:
  #
  #   topologySpreadConstraints:
  #     - maxSkew: 1
  #       topologyKey: topology.kubernetes.io/zone
  #       whenUnsatisfiable: ScheduleAnyway
  #       labelSelector:
  #         matchLabels:
  #           app.kubernetes.io/name: ovr
  #           app.kubernetes.io/component: worker
  topologySpreadConstraints: []
  podDisruptionBudget:
    enabled: false
    # Set exactly one of these. Either may be a count or a percentage.
    # minAvailable: 1 against a single replica blocks node drains outright.
    maxUnavailable: 1
    minAvailable: ""
  # CPU autoscaling for the worker is a poor fit -- a pod holding an idle
  # browser between snapshots looks unloaded while it is very much busy.
  # Prefer keda below, which scales on queue depth. Mutually exclusive with it.
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: ""
    metrics: []
    behavior: {}

  # Queue-depth autoscaling. Requires KEDA installed in the cluster; the chart
  # does not install it.
  keda:
    enabled: false
    minReplicaCount: 1
    maxReplicaCount: 5
    pollingInterval: 30
    # Must outlast the longest capture group, or KEDA scales away a pod still
    # holding a browser. groupSize snapshots at up to 2 minutes each, so
    # groupSize 4 wants ~480s here, and terminationGracePeriodSeconds has to
    # cover the in-flight snapshot on top of that.
    cooldownPeriod: 300
    advanced: {}
    # No default: the address format and authentication depend on your Redis.
    # Capture work lands on the BullMQ snapshot-capture queue, whose waiting
    # list is bull:snapshot-capture:wait.
    #
    #   triggers:
    #     - type: redis
    #       metadata:
    #         address: valkey:6379
    #         listName: bull:snapshot-capture:wait
    #         listLength: "4"
    #       authenticationRef:
    #         name: ovr-redis-auth
    triggers: []

migrate:
  enabled: true

# helm test: curls the web readiness endpoint through its Service.
tests:
  enabled: true
  image: busybox:1.37

# Off by default. Enabled, the worker gets a deny-all ingress policy -- it
# serves nothing and is never addressed by anything -- and the web pod admits
# traffic on its port. Egress always permits DNS, and is otherwise
# unrestricted: Postgres, Redis and object storage are usually outside the
# cluster and differ per install.
networkPolicy:
  enabled: false
  web:
    # Peers admitted to the web pod. Empty admits any pod in the cluster;
    # narrow it to your ingress controller:
    #
    #   from:
    #     - namespaceSelector:
    #         matchLabels:
    #           kubernetes.io/metadata.name: traefik
    from: []
  # Appended after the DNS allowance. Setting anything here replaces the
  # default unrestricted egress, so it must list everything the pods reach:
  # Postgres, Redis, object storage and any git forge.
  egress: []
