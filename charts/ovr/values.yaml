# Requires a Postgres database, a Redis-compatible instance, and an
# S3-compatible bucket already reachable from the cluster. This chart runs none
# of them — use managed services (Neon, RDS, AWS S3, R2) or deploy your own.

nameOverride: ""
fullnameOverride: ""

image:
  registry: ghcr.io/open-visual-regression
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Name of a Secret you create yourself with keys: DATABASE_URL, REDIS_URL,
# BETTER_AUTH_SECRET, OVR_GIT_TOKEN_ENCRYPTION_KEY, STORAGE_ACCESS_KEY,
# STORAGE_SECRET_KEY. Set this to use your own secret instead of the values
# below (recommended if using GitOps / Sealed Secrets / External Secrets).
existingSecret: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

# The images set USER by name (nextjs / pwuser), which the kubelet cannot
# verify against runAsNonRoot — it needs a numeric UID. Both resolve to 1001,
# matching the UID/GID build args in the app's Dockerfiles.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: false
  seccompProfile:
    type: RuntimeDefault

env:
  # Public URL the app will be served at.
  baseUrl: "https://ovr.example.com"
  logLevel: info

auth:
  # Generate: openssl rand -base64 32
  betterAuthSecret: ""
  # Generate: openssl rand -base64 32
  gitTokenEncryptionKey: ""
  # local: OVR's own email/password sign-in.
  # trusted-proxy: sign in from the identity token an SSO proxy forwards.
  mode: local
  trustedProxy:
    tokenHeader: ""
    issuer: ""
    audience: ""
    # Set exactly one of jwksUrl or keyUrl (a URL containing {kid}, as AWS ALB uses).
    jwksUrl: ""
    keyUrl: ""
    signer: ""
    algorithms: []
    emailClaim: ""
    nameClaim: ""
    groupsClaim: ""
    # Groups that grant each role, e.g. { admin: [ovr-admins], reviewer: [ovr-reviewers] }.
    roleGroups: {}
    logoutUrl: ""
    organizationName: ""

database:
  url: ""  # postgresql://user:pass@host:5432/open_visual_regression

redis:
  url: ""  # redis://host:6379
  mode: standalone  # or cluster

storage:
  # Leave endpoint/publicEndpoint empty and forcePathStyle false for AWS S3.
  # Set them (and forcePathStyle true) for MinIO, rustfs, R2, etc.
  endpoint: ""
  publicEndpoint: ""
  region: us-east-1
  bucket: ovr
  forcePathStyle: false
  accessKey: ""
  secretKey: ""

web:
  enabled: true
  replicas: 1
  port: 3000
  resources: {}
  containerSecurityContext: {}
  updateStrategy: RollingUpdate
  nodeSelector: {}
  tolerations: []
  affinity: {}
  image:
    tag: ""
    digest: ""
    override: ""  # full image reference; takes precedence over tag/digest above
  service:
    type: ClusterIP
    port: 3000
  ingress:
    enabled: false
    className: ""
    host: ovr.example.com
    annotations: {}
    tls: []
    # Redirect plain HTTP to HTTPS when tls is set. Supported for className
    # traefik and nginx; other controllers need their own redirect config.
    redirectHttps: true
  priorityClassName: ""
  topologySpreadConstraints: []
  # Added to the web pods, e.g. Datadog autodiscovery annotations.
  podAnnotations: {}
  podDisruptionBudget:
    enabled: false
    maxUnavailable: ""
    minAvailable: ""
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: ""
    metrics: []
    behavior: {}

worker:
  enabled: true
  replicas: 1
  concurrency: 2
  # Snapshots per capture-group job. Each group holds one browser for up to
  # 2 minutes per snapshot, so this also sets how long a stuck group runs
  # before its timeout fires. Empty uses the app default (10).
  groupSize: ""
  # Snapshots compared against their baseline at once. Empty uses the app
  # default (4).
  diffConcurrency: ""
  # Local disk for extracted Storybook builds. Empty uses the app default (2 GB).
  storybookCacheBytes: ""
  # Local disk for caching screenshots. Empty uses the app default (512 MB).
  imageCacheBytes: ""
  # Order capture groups run in across builds: "round-robin" or "fifo". Empty
  # uses round-robin, or fifo with worker.keda's generated trigger, which can't
  # see prioritized jobs. Also read by the web app.
  captureQueuePolicy: ""
  # Minutes without snapshot or diff updates, and with no jobs left to run,
  # before an unfinished build is errored. Empty uses the app default (30).
  reaperStaleMinutes: ""
  capture:
    # External hosts captures may load, such as image and font CDNs. Captures
    # block every other host, including requests a service worker (like msw)
    # passes through to the network. Entries are a host, host:port, or
    # *.example.com for its subdomains (not example.com itself). Sets
    # OVR_CAPTURE_ALLOWED_HOSTS. A snapshot that requests a blocked host gets a
    # warning in its logs that names the host.
    # allowedHosts:
    #   - images.example.com
    #   - fonts.googleapis.com
    #   - fonts.gstatic.com
    #   - "*.cdn.example.com"
    allowedHosts: []
  # Daily retention purge. Empty values use the app defaults.
  purge:
    # Jobs at once across all workers (1).
    concurrency: ""
    # Builds per transaction (10).
    batchSize: ""
    # Milliseconds between batches (500).
    batchPauseMs: ""
    # Milliseconds per project per run (600000).
    timeBudgetMs: ""
  resources: {}
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    readOnlyRootFilesystem: false
  updateStrategy: RollingUpdate
  # A capture-group job holds one browser open across its snapshots; the k8s
  # default (30s) SIGKILLs the pod mid-capture on every rollout, permanently
  # failing whatever snapshot was in flight. Give it real time to finish the
  # current snapshot and let BullMQ hand the rest of the group to the next pod.
  terminationGracePeriodSeconds: 180
  nodeSelector: {}
  tolerations: []
  affinity: {}
  image:
    tag: ""
    digest: ""
    override: ""
  # Chromium needs real /dev/shm; the k8s default (64Mi) crashes on non-trivial
  # pages. Mounted as an in-memory emptyDir.
  shmSize: 1Gi
  priorityClassName: ""
  topologySpreadConstraints: []
  # Added to the worker pods, e.g. Datadog autodiscovery annotations.
  podAnnotations: {}
  podDisruptionBudget:
    enabled: false
    maxUnavailable: ""
    minAvailable: ""
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: ""
    metrics: []
    behavior: {}

  keda:
    enabled: false
    minReplicaCount: 1
    maxReplicaCount: 5
    pollingInterval: 30
    cooldownPeriod: 300
    advanced: {}
    redisAddress: ""  # host:6379, as reachable from KEDA
    listLength: 4
    authenticationRef: {}  # { name: <TriggerAuthentication> } for a password or TLS
    triggers: []  # replaces the generated trigger

migrate:
  enabled: true

tests:
  enabled: true
  image: busybox:1.37

networkPolicy:
  enabled: false
  web:
    from: []
  # Who may scrape metrics. Empty allows the whole cluster.
  metrics:
    from: []
  egress: []

# Metrics for Prometheus, Datadog, or any OpenMetrics tool, on a port apart from app traffic.
metrics:
  enabled: false
  port: 9464
  # Prometheus Operator: scrape the web and worker pods.
  podMonitor:
    enabled: false
    interval: 30s
    labels: {}  # to match your Prometheus's podMonitorSelector
  # Prometheus Operator: alerts on failing and stuck builds.
  prometheusRule:
    enabled: false
    labels: {}  # to match your Prometheus's ruleSelector
  # Grafana dashboard ConfigMap, for the Grafana chart's sidecar.
  grafanaDashboard:
    enabled: false
    labels:
      grafana_dashboard: "1"
