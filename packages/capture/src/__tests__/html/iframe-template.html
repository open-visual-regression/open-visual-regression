<html>
  <body>
    <div id="storybook-root"></div>
    <script>
      window.__OVR_STORY_PARAMETERS__ = "__OVR_STORY_PARAMETERS_JSON__";
      window.__STORYBOOK_PREVIEW__ = {
        storeInitializationPromise: Promise.resolve(),
        loadStory: ({ storyId }) => {
          const ovr = window.__OVR_STORY_PARAMETERS__[storyId];
          if (ovr && ovr.__throw) {
            return Promise.reject(new Error("failed to prepare story"));
          }
          return Promise.resolve({ id: storyId, parameters: { ovr } });
        },
      };
    </script>
  </body>
</html>
