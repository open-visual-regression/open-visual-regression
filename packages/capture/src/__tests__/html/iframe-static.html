<!doctype html>
<html>
  <body>
    <div id="storybook-root" hidden="true"></div>
    <script>
      window.__STORYBOOK_ADDONS_CHANNEL__ = {
        _l: {},
        _current: undefined,
        on(e, l) {
          (this._l[e] ??= []).push(l);
        },
        off(e, l) {
          this._l[e] = (this._l[e] || []).filter((x) => x !== l);
        },
        emit(e, payload) {
          if (e !== "setCurrentStory") return;
          if (this._current === payload.storyId) {
            for (const listener of this._l["storyUnchanged"] || []) {
              listener(payload.storyId);
            }
            return;
          }
          this._current = payload.storyId;
          document.getElementById("storybook-root").textContent = "rendered: " + payload.storyId;
          for (const listener of this._l["storyRendered"] || []) {
            listener(payload);
          }
          for (const listener of this._l["storyFinished"] || []) {
            listener({ storyId: payload.storyId, status: "success" });
          }
        },
      };
    </script>
  </body>
</html>
