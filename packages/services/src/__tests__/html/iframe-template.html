<html>
  <body>
    <div id="storybook-root"></div>
    <script>
      window.__OVR_STORY_PARAMETERS__ = "__OVR_STORY_PARAMETERS_JSON__";
      const listeners = {};
      window.__STORYBOOK_ADDONS_CHANNEL__ = {
        on: (event, listener) => {
          (listeners[event] ||= []).push(listener);
        },
        off: (event, listener) => {
          listeners[event] = (listeners[event] || []).filter((l) => l !== listener);
        },
        emit: (event, payload) => {
          if (event !== "setCurrentStory") return;
          const storyId = payload.storyId;
          window.__STORYBOOK_PREVIEW__ = {
            currentRender: {
              story: { id: storyId, parameters: { ovr: window.__OVR_STORY_PARAMETERS__[storyId] } },
            },
          };
          for (const listener of listeners["storyRendered"] || []) {
            listener();
          }
          for (const listener of listeners["storyFinished"] || []) {
            listener({ storyId, status: "success" });
          }
        },
      };
    </script>
  </body>
</html>
