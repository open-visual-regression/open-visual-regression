x-app-env: &app-env
  DATABASE_URL: postgresql://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD:-postgres}@db:5432/${DATABASE_NAME:-open_visual_regression}
  REDIS_URL: redis://valkey:6379
  STORAGE_ENDPOINT: http://rustfs:9000
  STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://localhost:${STORAGE_PORT:-9000}}
  STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
  STORAGE_BUCKET: ${STORAGE_BUCKET:-ovr}
  STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-rustfsadmin}
  STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-rustfsadmin}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  BASE_URL: ${BASE_URL:-http://localhost:3000}
  OVR_GIT_TOKEN_ENCRYPTION_KEY: ${OVR_GIT_TOKEN_ENCRYPTION_KEY:?set OVR_GIT_TOKEN_ENCRYPTION_KEY in your .env}
  OVR_GITHUB_APP_CLIENT_ID: ${OVR_GITHUB_APP_CLIENT_ID:-}
  OVR_GITHUB_APP_PRIVATE_KEY: ${OVR_GITHUB_APP_PRIVATE_KEY:-}

services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-open_visual_regression}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -d ${DATABASE_NAME:-open_visual_regression} -U ${DATABASE_USER:-postgres}",
        ]
      interval: 1s
      timeout: 5s
      retries: 10
    ports:
      - ${DATABASE_PORT:-5432}:5432
    volumes:
      - pgdata:/var/lib/postgresql/data

  valkey:
    image: valkey/valkey:8-alpine
    restart: always
    ports:
      - ${REDIS_PORT:-6379}:6379
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 1s
      timeout: 5s
      retries: 10
    volumes:
      - valkeydata:/data

  rustfs:
    image: rustfs/rustfs:latest
    restart: always
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:-rustfsadmin}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_VOLUMES: /data
    ports:
      - ${STORAGE_PORT:-9000}:9000
      - ${STORAGE_CONSOLE_PORT:-9001}:9001
    volumes:
      - rustfsdata:/data

  createbuckets:
    image: amazon/aws-cli
    depends_on:
      rustfs:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:-rustfsadmin}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:-rustfsadmin}
      AWS_DEFAULT_REGION: ${STORAGE_REGION:-us-east-1}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until aws --endpoint-url http://rustfs:9000 s3 ls >/dev/null 2>&1; do
          echo "waiting for object storage..."
          sleep 2
        done
        aws --endpoint-url http://rustfs:9000 s3 mb "s3://${STORAGE_BUCKET:-ovr}" 2>/dev/null || true
    restart: "no"

  migrate:
    image: ${IMAGE_PREFIX:-ovr}/worker:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      args:
        UID: ${PUID:-1001}
        GID: ${PGID:-1001}
    command: ["node", "dist/migrate.js"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *app-env
    restart: "no"

  web:
    image: ${IMAGE_PREFIX:-ovr}/web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        UID: ${PUID:-1001}
        GID: ${PGID:-1001}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      createbuckets:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in your .env}
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      PORT: ${WEB_PORT:-3000}
      OVR_AUTH_MODE: ${OVR_AUTH_MODE:-local}
      OVR_AUTH_PROXY_TOKEN_HEADER: ${OVR_AUTH_PROXY_TOKEN_HEADER:-}
      OVR_AUTH_PROXY_ISSUER: ${OVR_AUTH_PROXY_ISSUER:-}
      OVR_AUTH_PROXY_AUDIENCE: ${OVR_AUTH_PROXY_AUDIENCE:-}
      OVR_AUTH_PROXY_JWKS_URL: ${OVR_AUTH_PROXY_JWKS_URL:-}
      OVR_AUTH_ROLE_GROUPS: ${OVR_AUTH_ROLE_GROUPS:-}
      OVR_AUTH_PROXY_LOGOUT_URL: ${OVR_AUTH_PROXY_LOGOUT_URL:-}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:${WEB_PORT:-3000}/api/rpc/health/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - ${WEB_PORT:-3000}:${WEB_PORT:-3000}

  worker:
    image: ${IMAGE_PREFIX:-ovr}/worker:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      args:
        UID: ${PUID:-1001}
        GID: ${PGID:-1001}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      createbuckets:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      OVR_CAPTURE_GROUP_CONCURRENCY: ${OVR_CAPTURE_GROUP_CONCURRENCY:-2}
    volumes:
      - workertmp:/tmp

  bull-board:
    build:
      context: .
      dockerfile: apps/bull-board/Dockerfile
      args:
        UID: ${PUID:-1001}
        GID: ${PGID:-1001}
    profiles: ["tools"]
    restart: unless-stopped
    depends_on:
      valkey:
        condition: service_healthy
    environment:
      REDIS_URL: redis://valkey:6379
      BULL_BOARD_PORT: ${BULL_BOARD_PORT:-3001}
    ports:
      - ${BULL_BOARD_PORT:-3001}:${BULL_BOARD_PORT:-3001}

  keycloak:
    image: keycloak/keycloak:26.8.1
    profiles: ["sso"]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8081
      KC_HOSTNAME: http://keycloak:8081
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./apps/e2e/sso/realm.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      - 8081:8081

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
    profiles: ["sso"]
    restart: unless-stopped
    depends_on:
      keycloak:
        condition: service_started
    command:
      - --provider=keycloak-oidc
      - --oidc-issuer-url=http://keycloak:8081/realms/ovr
      - --client-id=ovr
      - --client-secret=ovr-e2e-secret
      - --code-challenge-method=S256
      - --redirect-url=http://localhost:4180/oauth2/callback
      - --upstream=http://web:${WEB_PORT:-3000}
      - --http-address=0.0.0.0:4180
      - --cookie-secret=ovr-e2e-cookie-secret-32-bytes!!
      - --cookie-secure=false
      - --cookie-refresh=10s
      - --email-domain=*
      - --skip-provider-button=true
      - --pass-authorization-header=true
      - --skip-auth-strip-headers=false
      - --skip-auth-route=^/api/rpc/
    ports:
      - 4180:4180

  adminer:
    image: adminer:5
    profiles: ["tools"]
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - ${ADMINER_PORT:-8080}:8080

volumes:
  pgdata:
  valkeydata:
  rustfsdata:
  workertmp:
